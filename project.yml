name: DevCanopy
options:
  bundleIdPrefix: com.sassydog
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  xcodeVersion: "15.0"
  useBaseInternationalization: true
  minimumXcodeGenVersion: "2.35.0"
  generateEmptyDirectories: true

settings:
  DEVELOPMENT_TEAM: 52YMXC3348
  # Static INERT baselines for Xcode-GUI builds only (org Versioning spec §7,
  # generated-projects row): version values are NEVER computed into this file —
  # xcodegen evaluates it at generate-time, so a real value here would go stale
  # per commit. Real values are injected at xcodebuild time as command-line
  # build settings by Scripts/build.sh: MARKETING_VERSION from
  # Scripts/get-version-info.sh (CalVer) and CURRENT_PROJECT_VERSION from
  # Scripts/get-build-number.sh (total commit count). Never hand-bump these —
  # 0.0.0 is deliberately "visibly not a scripted release build".
  MARKETING_VERSION: 0.0.0
  CURRENT_PROJECT_VERSION: 1
  SWIFT_VERSION: "5.9"
  ENABLE_HARDENED_RUNTIME: true
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  CODE_SIGN_IDENTITY: "Apple Development"
  CODE_SIGN_STYLE: Automatic

packages:
  HostMetricsKit:
    path: Packages/HostMetricsKit
  # Optional crash/error reporting (issue #18). No-ops unless a SENTRY_DSN is
  # configured (env var or Info.plist) — honors "no telemetry by default".
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.58.3

configs:
  Debug:
    settings:
      SWIFT_COMPILATION_MODE: incremental
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_TESTABILITY: true
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      GCC_PREPROCESSOR_DEFINITIONS:
        - DEBUG=1
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: false
  Release:
    settings:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  DevCanopy:
    type: application
    platform: macOS
    sources:
      - path: DevCanopy
      - path: DevCanopy/Resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sassydog.devcanopy
        PRODUCT_NAME: DevCanopy
        INFOPLIST_FILE: DevCanopy/Resources/Info.plist
        # Default for the SentryDSN Info.plist key ($(SENTRY_DSN)). Empty so
        # local/Xcode-direct builds ship no DSN → Sentry no-ops (no telemetry by
        # default, issue #18). build.sh forwards a real DSN from the environment
        # (GitHub Actions secret) for release builds; never hardcode it here.
        SENTRY_DSN: ""
        # Build number: Info.plist reads $(CURRENT_PROJECT_VERSION); Scripts/build.sh
        # overrides it with the git commit count (Scripts/get-build-number.sh). This
        # is only the fallback for builds straight from Xcode. (A PlistBuddy
        # preBuildScript used to stamp the built product instead — it broke clean
        # Release builds because the processed Info.plist doesn't exist yet at
        # preBuild time.)
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        ENABLE_APP_SANDBOX: false
        ENABLE_USER_SELECTED_FILES: readwrite
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - package: HostMetricsKit
        product: HostMetricsKit
      - package: Sentry
        product: Sentry
    scheme:
      testTargets:
        - DevCanopyTests
      commandLineArguments:
        "-com.apple.CoreData.SQLDebug 1": false
        "-com.apple.CoreData.Logging.stderr 1": false

  DevCanopyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DevCanopyTests
    dependencies:
      - target: DevCanopy
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sassydog.devcanopy.tests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/DevCanopy.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DevCanopy

schemes:
  DevCanopy:
    build:
      targets:
        DevCanopy: all
        DevCanopyTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-com.apple.CoreData.SQLDebug 1":
          enabled: false
        "-com.apple.CoreData.Logging.stderr 1":
          enabled: false
    test:
      config: Debug
      targets:
        - name: DevCanopyTests
          parallelizable: true
          randomExecutionOrder: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
