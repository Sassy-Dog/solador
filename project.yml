name: DevCanopy
options:
  bundleIdPrefix: com.sassydog
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  xcodeVersion: "15.0"
  useBaseInternationalization: true
  minimumXcodeGenVersion: "2.35.0"
  generateEmptyDirectories: true

settings:
  DEVELOPMENT_TEAM: 52YMXC3348
  MARKETING_VERSION: 0.1.0
  CURRENT_PROJECT_VERSION: 1
  SWIFT_VERSION: "5.9"
  ENABLE_HARDENED_RUNTIME: true
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  CODE_SIGN_IDENTITY: "Apple Development"
  CODE_SIGN_STYLE: Automatic

packages:
  HostMetricsKit:
    path: Packages/HostMetricsKit

configs:
  Debug:
    settings:
      SWIFT_COMPILATION_MODE: incremental
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_TESTABILITY: true
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      GCC_PREPROCESSOR_DEFINITIONS:
        - DEBUG=1
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: false
  Release:
    settings:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  DevCanopy:
    type: application
    platform: macOS
    sources:
      - path: DevCanopy
        excludes:
          - "**/*.xcassets"
      - path: DevCanopy/Resources
        type: folder
    preBuildScripts:
      - name: Update Build Number
        script: |
          # Update build number from git
          BUILD_NUMBER=$(git rev-list --count HEAD 2>/dev/null || echo "1")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "${BUILT_PRODUCTS_DIR}/${INFOPLIST_PATH}"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sassydog.devcanopy
        PRODUCT_NAME: DevCanopy
        INFOPLIST_FILE: DevCanopy/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        ENABLE_APP_SANDBOX: false
        ENABLE_USER_SELECTED_FILES: readwrite
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - package: HostMetricsKit
        product: HostMetricsKit
    scheme:
      testTargets:
        - DevCanopyTests
      commandLineArguments:
        "-com.apple.CoreData.SQLDebug 1": false
        "-com.apple.CoreData.Logging.stderr 1": false

  DevCanopyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DevCanopyTests
    dependencies:
      - target: DevCanopy
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sassydog.devcanopy.tests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/DevCanopy.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DevCanopy

schemes:
  DevCanopy:
    build:
      targets:
        DevCanopy: all
        DevCanopyTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-com.apple.CoreData.SQLDebug 1":
          enabled: false
        "-com.apple.CoreData.Logging.stderr 1":
          enabled: false
    test:
      config: Debug
      targets:
        - name: DevCanopyTests
          parallelizable: true
          randomExecutionOrder: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true