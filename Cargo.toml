[workspace]
resolver = "2"
members = ["crates/viewmodel", "crates/metrics", "crates/agentclient", "app/src-tauri"]

[workspace.package]
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
