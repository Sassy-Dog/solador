[workspace]
resolver = "2"
members = ["crates/viewmodel", "crates/wire", "crates/agentclient", "crates/store", "crates/github", "crates/localhost", "crates/azurecost", "crates/usage", "crates/openclaw", "app/src-tauri"]

[workspace.package]
edition = "2021"
# 1.90 is the real floor: `is_multiple_of` (crates/viewmodel) needs 1.87+.
# Members opt in via `rust-version.workspace = true`; rust-toolchain.toml
# pins the exact dev/CI toolchain the same way agent/'s does.
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Platform config dir for crates/store (`~/Library/Application Support` on
# macOS, `%APPDATA%` on Windows). Already in the lock via tauri's own tree.
dirs = "6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
