name: Publish update feed

# `latest.json` — the manifest `tauri-plugin-updater` reads (#308).
#
# **Publishing is inside the verified job (#749).** `release.yml` attaches its
# artifacts to a DRAFT, and a draft is not servable: it is not attached to its
# tag and its assets are not publicly downloadable, so a manifest generated at
# build time would point every client into a 404. Pushing the `v*` tag is the
# approval, so `release.yml`'s last job CALLS this workflow with `publish: true`
# and the `feed` job below publishes the draft ITSELF, but only AFTER
# `solador-update-feed` has verified both updater signatures: a mis-signed build
# stays a draft, with a red run that says why. The feed therefore still does not
# exist until the release is public, so **a draft can never serve updates**.
#
# Why a call and not `release: published`: a release published with the
# workflow's own `GITHUB_TOKEN` does NOT fire `release: published` (GitHub
# suppresses events raised by that token), so a release workflow that simply
# published its draft would never have started this file. `release: published`
# and `workflow_dispatch` stay as the door for a draft someone publishes by hand
# and for replays; `publish` is deliberately NOT a dispatch input.
#
# This workflow holds NO credential: both `.sig` files were produced during the
# release builds (`build.sh`'s `make_updater_archive` for the macOS tarball, and
# `release.yml`'s `release-windows` job for the Windows installer) and are
# release assets. What happens here is a *verification* — `solador-update-feed`
# checks BOTH signatures against the public key in
# `app/src-tauri/tauri.conf.json` before it will write a manifest, so a
# mis-signed artifact fails this run instead of failing silently on every
# installed app. `ci.yml`'s `secrets-guard` asserts the absence: no secret
# reference may appear in this file at all.
#
# THE FEED CARRIES THREE TARGETS AND ALL OF THEM ARE REQUIRED (#705):
# `darwin-aarch64` and `darwin-x86_64` (one universal tarball) and
# `windows-x86_64` (the Authenticode-signed NSIS installer itself). A feed
# without the Windows key makes every updater-enabled Windows install fail its
# check on every launch (#368's symptom), so a release missing the installer or
# its `.sig` fails this run rather than shipping a macOS-only feed. The
# corollary is that this file cannot replay a release cut before the Windows
# leg minisigned its installer: that release has no Windows `.sig`, and the
# honest outcome is a red run, not a feed that is silently half a feed.
#
# DESKTOP ONLY, since #491. The agent's feed (`agent-latest.json`, #391) used to
# be a second, protected job here. The agent now has its own release train
# (#472): `agent-v*` tags, release-agent.yml, and publish-agent-feed.yml, which
# owns the feed, its signing and the `agent-latest` release. This file kept the
# `feed` job and gained one guard: it runs for a `v*` release or a manual
# dispatch, and for no `agent-v*` release. Without that, publishing an agent
# release would not write a bad `latest.json`; it would fail this job's tag
# check — one red run per agent release.
#
# The guard is NOT a bare `startsWith`. On a `workflow_dispatch` the release
# payload is empty, `startsWith('', 'v')` is false, and the desktop replay door
# below would be shut. Each event's clause carries its own event name. In a
# CALLED workflow `github.event_name` is the CALLER's event: `push`, with
# `github.ref` the tag and `github.event.release` empty.
#
# WHICH COPY OF THIS FILE RUNS. A `release` event runs the workflow file AT
# THE TAGGED COMMIT — `GITHUB_SHA` is the last commit in the tagged release
# and `GITHUB_REF` is the tag — not the copy on `main`. (Measured, not
# assumed: every `release` run in this repo reports `head_sha` = the tag's
# commit.) A tag cut before a change to this file publishes with its OWN,
# older copy. `workflow_dispatch` runs the file at the ref it is started from,
# which is a replay door that does run a newer file against an older tag's
# release: start it from `main`, the tag is checked out and
# `solador-update-feed` is built from the tag's tree (which needs
# `crates/updatefeed`), while the tag assertion (#404) is read from the
# DISPATCHING ref through a second checkout into `.tooling`, so a tag older
# than that script still replays. A CALL from `release.yml` runs this file at the
# tagged commit too: the caller's `github.sha` is the tag's commit.

on:
  release:
    types: [published]
  # The call from `release.yml`'s last job (#749). `publish: true` is what makes
  # the `feed` job publish the draft once the feed has verified; it is an input
  # of the call only, never of the manual door below, so a dispatch can
  # regenerate a feed but never publish a release.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build the feed for (e.g. v2026.8.114)'
        required: true
        type: string
      publish:
        description: 'Publish the draft release once latest.json has verified'
        required: false
        default: false
        type: boolean
  # The manual door, for a release published before this file existed, or one
  # whose feed run failed for a reason outside this file (a GitHub outage, an
  # asset uploaded late). A fix to this file itself needs a new tag — see
  # above. It holds no secret, so a `main`-ref replay is fine: it regenerates
  # `latest.json` for any `v*` tag. A dispatch carries no release payload, so
  # the notes and `published_at` are read from the release itself, below.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build the feed for (e.g. v2026.8.114)'
        required: true
        type: string

# Uploading latest.json to the release, and publishing the draft. Everything else
# in this repo stays `contents: read`, except what grants itself `contents:
# write` to create or publish a release or upload a feed: release.yml,
# release-agent.yml's `publish`, `publish-release` and `feed` jobs (`feed` for
# `actions: write`, to dispatch the agent's feed) and
# publish-agent-feed.yml's `agent-feed` job. When this file is CALLED, the
# caller's job grants the same `contents: write` (a called workflow cannot hold
# more than its caller gives it).
permissions:
  contents: write

jobs:
  feed:
    name: Generate and upload latest.json
    # One `latest.json` writer at a time: two runs racing on it for different
    # tags would resolve by upload order rather than by version.
    concurrency:
      group: publish-feed-desktop
      cancel-in-progress: false
    # A prerelease must not become `releases/latest`. GitHub already excludes
    # prereleases from that redirect, so publishing a feed for one would upload
    # an asset nothing reads — and if the exclusion ever changed, it would
    # quietly offer a prerelease to every stable install.
    #
    # And only a `v*` release (#491): an `agent-v*` release belongs to
    # publish-agent-feed.yml, and `startsWith(…, 'v')` does not match
    # `agent-v…`.
    #
    # Each event's clause is guarded by its OWN event name. Actions compares
    # loosely — `null == false` is TRUE — so a bare
    # `github.event.release.prerelease == false` is satisfied on a dispatch,
    # where there is no release payload at all; and a bare `startsWith` on the
    # release tag is false there, which would shut the replay door. A dispatch
    # is checked by the tag-shape step below instead.
    #
    # The CALLED path (#749) is `push`: a called workflow carries its caller's
    # event, and `release.yml` runs on a tag push. It is keyed on the caller's
    # ref being a `v*` tag, which `startsWith(…, 'refs/tags/v')` is and
    # `refs/tags/agent-v…` is not. The tag-shape step still decides the rest.
    if: >-
      (github.event_name == 'release'
        && startsWith(github.event.release.tag_name, 'v')
        && !github.event.release.prerelease)
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
        && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the tag
        id: tag
        env:
          # Through the environment, never interpolated into the script: these
          # are event fields, and `${{ }}` inside `run:` is substitution before
          # the shell ever sees it. `inputs.tag` is the dispatch's and the
          # call's; `EVENT_TAG` is empty on both.
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${EVENT_TAG:-$INPUT_TAG}"
          # Fail closed on anything that is not the tag shape publish.sh mints.
          # This value becomes a checkout ref and a download URL below.
          if [[ ! "$tag" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a vYYYY.M.P release tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Building the feed for $tag"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          # MANDATORY, for the reason release.yml states: the assertion below
          # counts commits, and a shallow clone answers "commits this month"
          # with 1 rather than failing — so `assert-release-tag.sh` refuses a
          # shallow checkout outright.
          fetch-depth: 0

      # The acceptance item, asserted rather than assumed: the tag is what
      # names the assets and the manifest's `version` is derived from it, so
      # the tag has to be the one the mint produced at this commit, or the feed
      # would advertise a version whose artifact is a different build.
      #
      # Asked of the MINT, not of a bare `--version` (#404): the script re-runs
      # publish.sh's ladder read-only, pinned to the tag's own month, and
      # requires `reuse` of exactly this tag. The bare comparison this replaced
      # was month-bound — a draft tagged on the 30th and published on the 1st
      # failed here after a person had published it, and `releases/latest`
      # then served a release with no `latest.json` for every installed cockpit
      # to 404 on, with no replay that could pass. This job builds nothing
      # versioned (the manifest's `version` is `${tag#v}` above), so there is
      # no MARKETING_VERSION pin to set here.
      #
      # The script comes from the ref this run was STARTED from, not from the
      # tag's tree — a second checkout, into a side directory the tag checkout
      # never looks at. On `release: published` the two are the same commit
      # (see the header). On the desktop replay door they are not: a
      # `main`-ref dispatch exists precisely so a newer copy of this file can
      # regenerate `latest.json` for an OLDER tag, and every tag cut before
      # #404 has no `scripts/assert-release-tag.sh` in its tree — the step
      # would die with `No such file` for exactly the releases the door is
      # for. The mint beside the script runs against the tag checkout (cwd),
      # so what is asserted is still the tag at its own commit; only the
      # asserting code is current. Depth 1 is enough here: the script checks
      # shallowness of the repo it runs IN (the tag checkout above), not of
      # the directory it is read from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .tooling

      - name: Assert the tag is the mint's own
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: .tooling/scripts/assert-release-tag.sh "$TAG"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.1
        with:
          workspaces: .

      # `gh release download` finds a DRAFT as well as a published release,
      # which the publish path needs: the payload is verified BEFORE the draft
      # is published.
      - name: Download the release's updater payload
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p feed
          # The two updater payloads and their signatures only. The .dmg is the
          # human download and the updater cannot apply one. The Windows payload
          # is the installer itself (#705); `*-setup.exe` does not match
          # `*-setup.exe.sig`, and the explicit second pattern fetches the
          # signature.
          #
          # `|| true`: gh's own "no assets match" failure is less useful than the
          # messages below, which say what a missing payload means and what to
          # do about it. The count checks are the gate, not this command.
          gh release download "$TAG" --dir feed \
            --pattern '*.app.tar.gz' --pattern '*.app.tar.gz.sig' \
            --pattern '*-setup.exe' --pattern '*-setup.exe.sig' || true

          shopt -s nullglob
          tarballs=(feed/*.app.tar.gz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "::error::expected exactly one .app.tar.gz on $TAG, found ${#tarballs[@]}"
            echo "A release with no updater payload cannot serve updates. Re-run release.yml" >&2
            echo "for this tag, or publish a release built after #308." >&2
            exit 1
          fi
          tarball="${tarballs[0]}"
          if [[ ! -s "$tarball.sig" ]]; then
            echo "::error::$(basename "$tarball") has no .sig asset on $TAG"
            exit 1
          fi

          # Exactly one installer, and its signature (#705). Zero fails the feed
          # (a macOS-only feed would break every Windows install's check); more
          # than one fails it too, because picking one would be a guess about
          # which installer the signature in the feed belongs to.
          installers=(feed/*-setup.exe)
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo "::error::expected exactly one *-setup.exe on $TAG, found ${#installers[@]}"
            echo "A feed without the Windows installer would fail every Windows install's" >&2
            echo "update check on every launch. Re-run release.yml for this tag, or" >&2
            echo "publish a release built after #705." >&2
            exit 1
          fi
          installer="${installers[0]}"
          if [[ ! -s "$installer.sig" ]]; then
            echo "::error::$(basename "$installer") has no .sig asset on $TAG"
            echo "A release cut before #705 has no Windows signature and needs a new tag;" >&2
            echo "re-running that tag's release.yml will not help." >&2
            exit 1
          fi

          {
            echo "tarball=$tarball"
            echo "asset=$(basename "$tarball")"
            echo "installer=$installer"
            echo "installer_asset=$(basename "$installer")"
          } >> "$GITHUB_OUTPUT"
          echo "Downloaded $(basename "$tarball") ($(du -h "$tarball" | cut -f1)) and $(basename "$installer") ($(du -h "$installer" | cut -f1)), each with its .sig"

      # The release body and `published_at`, read from the RELEASE rather than
      # the event payload, so every path (published, dispatched, called) gets the
      # same answer about the release as it is now. `gh release view` sees a
      # draft; `GET /releases/tags/<tag>` does not, and on the publish path the
      # release is still a draft here.
      #
      # The body goes through a file, verbatim. Never interpolated into a shell
      # command: it is maintainer- and contributor-authored text (GitHub's
      # generated notes quote PR titles), and it reaches the app as textContent,
      # never as markup.
      #
      # A draft has no meaningful `publishedAt`, so it is read only from a
      # release that is public; otherwise the value stays empty and the manifest
      # omits `pub_date` rather than carry a plausible timestamp.
      - name: Read the release's notes and publication date
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          release="$(gh release view "$TAG" --json isDraft,isPrerelease,body,publishedAt)"
          jq -j '.body // ""' <<< "$release" > feed/notes.md
          # The called path has no `!prerelease` clause in the job's `if:` (a
          # call carries no release payload), so the guard that keeps a
          # prerelease from becoming `releases/latest` is made here, before
          # anything is built or published.
          if [[ "$PUBLISH" == "true" && "$(jq -r '.isPrerelease' <<< "$release")" == "true" ]]; then
            echo "::error::$TAG is a prerelease — publishing it with --latest would offer a prerelease to every stable install"
            exit 1
          fi
          is_draft="$(jq -r '.isDraft' <<< "$release")"
          published_at=""
          if [[ "$is_draft" == "false" ]]; then
            published_at="$(jq -r '.publishedAt // ""' <<< "$release")"
          fi
          {
            echo "is_draft=$is_draft"
            echo "published_at=$published_at"
          } >> "$GITHUB_OUTPUT"
          echo "$TAG: isDraft=$is_draft"

      # Verify, then write. `solador-update-feed` refuses to emit a manifest
      # unless BOTH signatures cover their artifacts, under the public key the
      # app compiles in — the negative case #308 exists to guarantee, checked
      # here as well as on every operator's machine.
      - name: Build and verify latest.json
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARBALL: ${{ steps.assets.outputs.tarball }}
          ASSET: ${{ steps.assets.outputs.asset }}
          INSTALLER: ${{ steps.assets.outputs.installer }}
          INSTALLER_ASSET: ${{ steps.assets.outputs.installer_asset }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          DOWNLOAD_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download
        run: |
          # This is the gate on the publish path: a manifest is refused unless
          # both signatures verify, and the draft is published only after it.
          #
          # `published_at` is RFC 3339 already; empty while the release is
          # still a draft, where "now" would be a lie about when the release
          # happened, so the key is simply omitted rather than filled with a
          # plausible timestamp. (The publish path rebuilds with the real one.)
          #
          # An `if`, not `[[ … ]] && …`: GitHub runs `run:` blocks under `bash
          # -e`, where a compound whose test fails is a failed command and takes
          # the step down with it.
          date_arg=()
          if [[ -n "$PUBLISHED_AT" ]]; then
            date_arg=(--pub-date "$PUBLISHED_AT")
          fi

          cargo run --locked -p solador-updatefeed --bin solador-update-feed -- \
            --version "$VERSION" \
            --tarball "$TARBALL" \
            --signature "$TARBALL.sig" \
            --url "$DOWNLOAD_BASE/$TAG/$ASSET" \
            --windows-installer "$INSTALLER" \
            --windows-signature "$INSTALLER.sig" \
            --windows-url "$DOWNLOAD_BASE/$TAG/$INSTALLER_ASSET" \
            --tauri-config app/src-tauri/tauri.conf.json \
            --notes-file feed/notes.md \
            "${date_arg[@]}" \
            --out feed/latest.json

          echo "--- latest.json ---"
          cat feed/latest.json

      # Pushing the tag was the approval, and this is the only step that acts on
      # it — after the build above has verified both updater signatures against
      # the app's public key, so a mis-signed build is a red run on a draft and
      # never a public release with a feed nobody can verify.
      #
      # `--latest` only when this tag sorts at or above the newest PUBLISHED,
      # non-prerelease `v*` release: `releases/latest` is the endpoint the app
      # polls, and re-running the failed jobs of an OLDER draft after a newer
      # release has shipped must not hand it the older one. Otherwise
      # `--latest=false`. The feed upload below is unchanged either way: an older
      # release's `latest.json` is not what `releases/latest` serves, and the
      # endpoint step checks shape only.
      #
      # A release that is already public (a re-run of a run that got this far)
      # is left alone: publishing is a no-op the second time, so a re-run
      # passes. `published_at` is read BACK, after the edit, because it is
      # GitHub's own timestamp of the moment the release became public.
      - name: Publish the draft release
        id: publish
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          IS_DRAFT: ${{ steps.release.outputs.is_draft }}
        run: |
          if [[ "$IS_DRAFT" == "true" ]]; then
            # The list is captured on its own line so that a failed `gh` (a 5xx,
            # a rate limit, a token error) fails this step: it must never read
            # as "no release yet" and publish an older tag as the latest. Only
            # grep's "no match" (exit 1) means there is no published `v*`
            # release.
            published="$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 \
              --json tagName --jq '.[].tagName')"
            newest=""
            if v_tags="$(grep -E '^v[0-9]' <<< "$published")"; then
              newest="$(sort -V <<< "$v_tags" | tail -n1)"
            fi
            top="$(printf '%s\n%s\n' "$newest" "$TAG" | grep -E '^v[0-9]' | sort -V | tail -n1)"
            if [[ "$top" == "$TAG" ]]; then
              latest_flag="--latest"
              took_latest=true
              echo "Publishing $TAG with --latest: it sorts at or above the newest published release (${newest:-none published yet})."
            else
              latest_flag="--latest=false"
              took_latest=false
              echo "Publishing $TAG with --latest=false: $newest is a newer published release and keeps releases/latest."
            fi
            gh release edit "$TAG" --draft=false "$latest_flag"
            # Recorded for the failure hint's wording: whether THIS release took
            # `releases/latest` decides whether a missing feed hurts anyone. Not
            # written on the already-public path, where it is not known here.
            echo "latest=$took_latest" >> "$GITHUB_OUTPUT"
            echo "Published $TAG."
          else
            echo "$TAG is already public; nothing to publish."
          fi
          published_at="$(gh release view "$TAG" --json publishedAt --jq '.publishedAt // ""')"
          if [[ -z "$published_at" ]]; then
            echo "::error::$TAG reports no publishedAt after publishing"
            exit 1
          fi
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"

      # The same manifest again, now that the release has a publication date.
      # Built by the same binary, which verifies both signatures again, so what
      # is uploaded is what `solador-update-feed` emitted after checking them.
      - name: Rebuild latest.json with the publication date
        if: inputs.publish
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARBALL: ${{ steps.assets.outputs.tarball }}
          ASSET: ${{ steps.assets.outputs.asset }}
          INSTALLER: ${{ steps.assets.outputs.installer }}
          INSTALLER_ASSET: ${{ steps.assets.outputs.installer_asset }}
          PUBLISHED_AT: ${{ steps.publish.outputs.published_at }}
          DOWNLOAD_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download
        run: |
          cargo run --locked -p solador-updatefeed --bin solador-update-feed -- \
            --version "$VERSION" \
            --tarball "$TARBALL" \
            --signature "$TARBALL.sig" \
            --url "$DOWNLOAD_BASE/$TAG/$ASSET" \
            --windows-installer "$INSTALLER" \
            --windows-signature "$INSTALLER.sig" \
            --windows-url "$DOWNLOAD_BASE/$TAG/$INSTALLER_ASSET" \
            --tauri-config app/src-tauri/tauri.conf.json \
            --notes-file feed/notes.md \
            --pub-date "$PUBLISHED_AT" \
            --out feed/latest.json

          echo "--- latest.json ---"
          cat feed/latest.json

      - name: Upload latest.json to the release
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release upload "$TAG" feed/latest.json --clobber
          echo "Uploaded latest.json to $TAG."

      # The app is configured with `releases/latest/download/latest.json`, and
      # that redirect is GitHub's, not ours. Checking it here is the difference
      # between "we uploaded an asset" and "the endpoint the app polls serves a
      # manifest" — which are two claims, and only the second one matters.
      - name: Confirm the configured endpoint serves a manifest
        id: endpoint
        env:
          ENDPOINT: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$ENDPOINT" -o served.json; then
              break
            fi
            echo "attempt $attempt: not served yet, waiting…"
            sleep 5
          done
          if [[ ! -s served.json ]]; then
            echo "::error::$ENDPOINT does not serve latest.json"
            exit 1
          fi
          # Shape, not equality: `releases/latest` is the newest non-prerelease
          # release, which on a re-run of an older tag is legitimately a
          # different (and also valid) manifest. Asserting this run's version
          # here would fail that case for being correct.
          served="$(jq -r '.version' served.json)"
          #
          # All three targets (#705): a served feed missing `windows-x86_64` is
          # the one that fails every Windows install's check on every launch.
          jq -e '.platforms["darwin-aarch64"].signature and .platforms["darwin-x86_64"].url and .platforms["windows-x86_64"].signature and .platforms["windows-x86_64"].url' served.json >/dev/null
          echo "The configured endpoint currently offers $served."

      # The one failure that leaves users worse off than a red draft: the release
      # went public and a LATER step failed, so it is public with no served
      # `latest.json`. That includes the publish step itself, whose read-back of
      # `publishedAt` follows the edit: the step can fail with the release
      # already public. So this keys on the run's failure and the release's own
      # state (`isDraft`, `isLatest`, read through GraphQL: `gh release view` has
      # no `isLatest` field), not on the publish step's outcome. It is the last step
      # because `failure()` is only true for steps that run after the failing
      # one. Prints the state and the way out; changes nothing, and never states
      # a release state it could not read.
      - name: Say what a failure after publishing means
        if: failure() && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          unknown() {
            echo "::error::this job failed and the release's state could not be read, so it is unknown whether it is still a draft; check with: gh api graphql -f query='query(\$o:String!,\$r:String!,\$t:String!){repository(owner:\$o,name:\$r){release(tagName:\$t){isDraft isLatest}}}' -f o=${GITHUB_REPOSITORY%/*} -f r=${GITHUB_REPOSITORY#*/} -f t=${TAG:-<tag>}  (then re-run)"
            exit 0
          }
          [[ -n "$TAG" ]] || unknown
          # A missing tag reads as an empty line with exit 0, so only the exact
          # strings `true` and `false` count as a read. The `$o` `$r` `$t` in the
          # query are GraphQL variables, not shell ones.
          # shellcheck disable=SC2016
          state="$(gh api graphql \
            -f query='query($o:String!,$r:String!,$t:String!){repository(owner:$o,name:$r){release(tagName:$t){isDraft isLatest}}}' \
            -f o="${GITHUB_REPOSITORY%/*}" -f r="${GITHUB_REPOSITORY#*/}" -f t="$TAG" \
            --jq '.data.repository.release | [.isDraft, .isLatest] | @tsv')" || unknown
          IFS=$'\t' read -r is_draft is_latest <<< "$state"
          case "$is_draft" in
            true) exit 0 ;;
            false) ;;
            *) unknown ;;
          esac
          if [[ "$UPLOAD" == "success" ]]; then
            feed="latest.json was uploaded but the endpoint check did not confirm it"
          else
            feed="latest.json was not uploaded"
          fi
          case "$is_latest" in
            true)
              echo "::error::the release is now PUBLIC and holds releases/latest, and $feed, so installed cockpits' update checks fail until the feed is uploaded and served" ;;
            false)
              echo "::error::the release is now PUBLIC; $feed; releases/latest was not moved to this release; this step did not check what it serves" ;;
            *)
              echo "::error::the release is now PUBLIC; $feed; whether it holds releases/latest is unknown (its isLatest could not be read)" ;;
          esac
          echo "Use 'Re-run failed jobs' on this run: the publish step finds the release already public and does nothing, then the manifest is rebuilt and uploaded." >&2
