name: Dependabot auto-merge

# Enables auto-merge on qualifying Dependabot PRs so they enter the merge queue
# without a human press. This workflow never merges anything itself: it flips
# the auto-merge flag, and the "main protection" ruleset's merge queue decides
# when (and whether) the PR actually lands.
#
# Not generator-owned. `.github/dependabot.yml` carries no `generated-by:`
# marker and is deliberately hand-written (see #260); this file is too, so the
# pair stays consistent and setup-deps skips both.

on: pull_request

# GITHUB_TOKEN still does the read-only work (metadata, comments). It cannot do
# the auto-merge call -- see the app-token step for why -- but these two scopes
# are still the minimum for the rest.
permissions:
  contents: write
  pull-requests: write

# One run per PR. A force-push from Dependabot supersedes the older run rather
# than racing it to set the same flag.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    # `github.actor` is the only trustworthy signal here. Do not match on PR
    # title or branch prefix: any contributor can open a branch named
    # `dependabot/...`, and this job holds write scopes.
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # THE GATE — decides which updates merge unread.
      #
      # Available outputs (verified against this repo's own merged commits on
      # 2026-08-11):
      #
      #   steps.meta.outputs.update-type
      #     'version-update:semver-patch' | ':semver-minor' | ':semver-major'
      #     *** EMPTY STRING for SHA-pinned github-actions bumps. ***
      #     PR #255 (Swatinem/rust-cache) carried no `update-type:` trailer at
      #     all -- its `dependency-version` was the raw SHA, because a SHA pin
      #     has no semver to diff. The version comment did not even change
      #     (# v2.9.1 -> # v2.9.1).
      #
      #   steps.meta.outputs.package-ecosystem
      #     'cargo' | 'npm_and_yarn' | 'github_actions'
      #     NOTE: underscores, and 'npm_and_yarn' -- these are NOT the same
      #     strings dependabot.yml uses for `package-ecosystem:`.
      #
      #   steps.meta.outputs.dependency-names       comma-separated
      #   steps.meta.outputs.directory              e.g. '/agent'
      #
      # Decided policy (2026-08-11): patch + minor auto-merge, majors are held
      # for review; all four ecosystems participate, github-actions included.
      #
      # The gate is written FAIL-CLOSED: it names the cases that may merge, so
      # anything it does not recognise is held rather than let through. The one
      # exemption -- github_actions with an EMPTY update-type -- is deliberately
      # narrow. It covers the SHA-pin case (no semver exists to classify) and
      # nothing else. Do NOT widen it to `package-ecosystem == 'github_actions'`
      # alone: every action here is SHA-pinned today, but a future tag-pinned
      # `uses: foo/bar@v4` WOULD report an update-type, and the broader form
      # would auto-merge a major Actions bump because the ecosystem test
      # short-circuits before the type test runs.
      #
      # Evaluated once into an output rather than repeated on each step below:
      # four copies of a boolean this subtle is four chances to edit three.
      # Anything falling through lands in `Explain a held PR`, so a held PR
      # announces itself instead of sitting quiet for a week.
      # ---------------------------------------------------------------------
      - name: Apply the auto-merge gate
        id: gate
        env:
          QUALIFIES: >-
            ${{ steps.meta.outputs.update-type == 'version-update:semver-patch'
            || steps.meta.outputs.update-type == 'version-update:semver-minor'
            || (steps.meta.outputs.package-ecosystem == 'github_actions'
            && steps.meta.outputs.update-type == '') }}
        run: |
          echo "qualifies=$QUALIFIES" >> "$GITHUB_OUTPUT"
          echo "qualifies: $QUALIFIES"

      # ---------------------------------------------------------------------
      # Why an app token and not GITHUB_TOKEN.
      #
      #   "If the target branch uses a merge queue, the built-in GITHUB_TOKEN
      #    cannot add pull requests to the queue."   -- GitHub docs
      #
      # Not a permissions problem, and raising scopes does not help: the
      # refusal is on the token's identity. Enabling auto-merge still
      # SUCCEEDS -- flag set, step exits 0, job green -- and then nothing
      # happens. #265 sat CLEAN with auto-merge on and isInMergeQueue:false
      # for 13 hours, this workflow's first live subject, until it was
      # enqueued by hand.
      #
      # Sassy-Dog/platform hit the same wall from the other side (#461) and
      # its note is worth carrying: where a GITHUB_TOKEN enqueue does land,
      # the queue's `merge_group` event dispatches NO workflow runs, because
      # GitHub does not trigger runs from events initiated by GITHUB_TOKEN
      # (recursion prevention). The required checks never report and the
      # entry is silently evicted after check_response_timeout_minutes -- 60
      # here. Either way the failure is invisible: no red check, the PR just
      # leaves. Their #467 was enqueued 06:25:25 and evicted 07:28:47 having
      # created zero runs.
      #
      # sassydog-platform-writer carries exactly contents:write +
      # pull_requests:write. NOT -admin, which is read-only on both and
      # cannot merge. No `owner`/`repositories` input below, so the minted
      # token is scoped to this repository alone.
      #
      # Credentials come from the org's *Dependabot* secret store, not the
      # Actions one. A Dependabot-triggered run is handed Dependabot secrets
      # and nothing else -- "Your secrets are available in Dependabot secrets
      # rather than as GitHub Actions secrets" -- so the identically-named
      # Actions secret would arrive here empty.
      # ---------------------------------------------------------------------
      - name: Require the app credentials
        if: steps.gate.outputs.qualifies == 'true'
        env:
          APP_ID: ${{ secrets.PLATFORM_WRITER_APP_ID }}
          APP_KEY: ${{ secrets.PLATFORM_WRITER_APP_PRIVATE_KEY }}
        # An unreachable secret is an EMPTY STRING, never an error. Without
        # this guard a scoping mistake reproduces the exact bug above: green
        # job, parked PR, no signal.
        #
        # This is not hypothetical here. Both org Dependabot secrets are
        # visibility=private, which covers private and INTERNAL repos -- this
        # one, today. It excludes PUBLIC repos, and this repo is going public
        # (#259, #262). Eleven other repos read the same two secrets and none
        # of them is public yet, so nothing in the org has exercised that
        # edge: devcanopy will be the first, and on cutover day these resolve
        # to "" with no error anywhere. Re-scoping them is a pre-cutover task
        # that belongs to the org, not to this file; this guard is what makes
        # forgetting it loud instead of silent.
        run: |
          missing=
          [ -n "$APP_ID" ]  || missing="$missing PLATFORM_WRITER_APP_ID"
          [ -n "$APP_KEY" ] || missing="$missing PLATFORM_WRITER_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing Dependabot secret(s):$missing —" \
                 "auto-merge cannot be enabled by an identity the merge queue accepts." \
                 "Check that the org Dependabot secrets are visibility=selected and include this repository."
            exit 1
          fi
          echo "OK: app credentials present."

      - name: Mint an app token
        id: token
        if: steps.gate.outputs.qualifies == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `app-id` is deprecated in favor of `client-id`; the action feeds
          # either into the same JWT-issuer field, and GitHub accepts the
          # numeric App ID (this secret) as well as the Client ID there.
          # Same pin and same input as Sassy-Dog/platform, deliberately.
          client-id: ${{ secrets.PLATFORM_WRITER_APP_ID }}
          private-key: ${{ secrets.PLATFORM_WRITER_APP_PRIVATE_KEY }}

      - name: Enable auto-merge
        id: enable
        if: steps.gate.outputs.qualifies == 'true'
        # No method flag: under a merge queue the strategy is the queue's
        # (`merge_method: SQUASH` in the "main protection" ruleset), and
        # GitHub ignores the flag anyway -- `gh pr merge --auto --squash`
        # prints "The merge strategy for main is set by the merge queue" and
        # still records MERGE. autoMergeRequest.mergeMethod is MERGE on every
        # PR here, including ones that merge fine; it is not a signal.
        #
        # No `--delete-branch` either. It is rejected outright under a queue;
        # the repo's delete_branch_on_merge:true handles cleanup.
        run: gh pr merge --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.token.outputs.token }}

      # The enable step's exit code says nothing about whether the PR can ever
      # merge -- that WAS the defect. What distinguishes a working auto-merge
      # from a parked one is the identity that enabled it, and that is
      # readable immediately. isInMergeQueue is not: required checks have not
      # run yet, so the PR cannot be in the queue at this point no matter what.
      - name: Verify auto-merge was enabled by the app
        if: steps.gate.outputs.qualifies == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          actor="$(gh pr view "$PR_URL" --json autoMergeRequest \
            --jq '.autoMergeRequest.enabledBy.login // "none"')"
          echo "auto-merge enabled by: $actor"
          case "$actor" in
            none)
              echo "::error::Auto-merge is not enabled on this PR." \
                   "The enable step reported success, so this is a silent failure — investigate before merging anything by hand."
              exit 1
              ;;
            github-actions | github-actions[bot])
              echo "::error::Auto-merge was enabled by GITHUB_TOKEN, which the merge queue will not accept." \
                   "The app token did not take. This PR would sit green and never enter the queue."
              exit 1
              ;;
          esac

      # A held PR must say so. The failure this workflow exists to prevent is
      # a queue of green PRs nobody presses; a gate that parks something
      # silently just reproduces that one layer down.
      - name: Explain a held PR
        if: steps.gate.outputs.qualifies != 'true'
        run: |
          gh pr comment "$PR_URL" --body "$(cat <<EOF
          **Held for review — auto-merge not enabled.**

          | field | value |
          | --- | --- |
          | ecosystem | \`${ECOSYSTEM:-(empty)}\` |
          | update type | \`${UPDATE_TYPE:-(empty)}\` |
          | directory | \`${DIRECTORY:-(empty)}\` |

          This PR did not match the auto-merge gate in
          \`.github/workflows/dependabot-auto-merge.yml\`. Review it, then enqueue
          it directly — \`gh pr merge --auto\` will not work by hand either, because
          the merge queue rejects the token behind it:

          \`\`\`
          gh api graphql -f query='mutation(\$id:ID!){enqueuePullRequest(input:{pullRequestId:\$id}){mergeQueueEntry{id}}}' \\
            -f id="\$(gh pr view $PR_NUMBER --json id --jq .id)"
          \`\`\`
          EOF
          )"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DIRECTORY: ${{ steps.meta.outputs.directory }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
