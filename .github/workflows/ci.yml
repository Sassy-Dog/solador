name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Required for the merge queue: without this the queue builds a merge_group
  # ref, no check ever reports against it, and entries sit until they time out.
  merge_group:

# Least-privilege default token: jobs only read repo contents. Widen per-job if
# a future step needs more (e.g. packages: write).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only dedupe redundant PR runs. main pushes must each get a verdict, so a
  # follow-up push never cancels an in-flight main run (see run 27231906125).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent-tests:
    name: Rust agent
    # GitHub-hosted, and it must stay that way: on a public repo a self-hosted
    # runner executes any fork's pull request on our own machines. Nothing here
    # needs the fleet — dtolnay/rust-toolchain installs into $HOME and honors
    # the root rust-toolchain.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain version is pinned in rust-toolchain.toml; this action honors
      # it. Pinned to the stable-channel action at a fixed commit.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1

      # `-p solador-agent` is load-bearing, not tidiness. The agent joined the
      # root workspace, so a bare `cargo build` here resolves the whole
      # workspace — including app/src-tauri, which needs webkit2gtk system
      # libraries this runner does not have and this job has no reason to
      # install. Scoping to the package keeps the Linux job building only what
      # actually deploys to Linux.
      - name: Format check
        run: cargo fmt -p solador-agent --check

      - name: Clippy
        run: cargo clippy --locked -p solador-agent --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked -p solador-agent --verbose

      - name: Test
        run: cargo test --locked -p solador-agent --verbose

      # agent/deploy/ is the agent's only path onto a host, and until #269
      # nothing in CI executed it — not even a syntax check. #268 broke every
      # deploy for as long as it took someone to try one, behind three green
      # required checks, `./dev lint` and `./dev test`.
      #
      # No install step for shellcheck: the ubuntu-latest image ships it. If a
      # future image stops doing so this step goes red, which is the correct
      # outcome — a lint gate that silently skips itself is what got us here.
      - name: Shell syntax check (agent/deploy)
        run: bash -n agent/deploy/*.sh

      - name: ShellCheck (agent/deploy)
        run: |
          shellcheck --version
          shellcheck -S warning agent/deploy/*.sh

      # Sits after the Rust steps because one of its target_dir cases runs the
      # real `cargo locate-project` against a scratch workspace; everything
      # else stubs cargo/curl/sleep and touches no host.
      - name: Deploy helper tests (agent/deploy/lib.sh)
        run: bash agent/deploy/lib_test.sh

  rust-workspace:
    name: Rust workspace + frontend e2e
    # macOS is required, not preferred: app/src-tauri only builds on
    # macOS/Windows targets, and the frontend suite needs a real WebView-capable
    # desktop to serve/build against. macos-latest provides both, and Playwright
    # installs its own chromium, so the image needs nothing bespoke.
    #
    # Formerly the self-hosted Mac pool. Hosted runners are free on public
    # repos, including macOS, which removes the two-runner scarcity that
    # constrained the earlier job layout.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain version is pinned in the workspace-root rust-toolchain.toml;
      # this action honors it. One pin now covers every job, the agent included.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          workspaces: .

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      # Node/Playwright is the only npm in the repo (tests/frontend/package.json).
      # cache: npm speeds up repeat runs the same way Swatinem/rust-cache does
      # for cargo above.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json

      - name: Install frontend test dependencies
        working-directory: tests/frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: tests/frontend
        run: npx playwright install chromium

      # `npm test`'s `pretest` script builds solador-app and runs its --dump
      # mode to (re)generate the gitignored app/ui/sample.json fixture the
      # suite serves, so the build always happens before Playwright runs
      # against it — npm's pretest/test ordering is what enforces that, not
      # step order here. This suite is the only thing that exercises app/ui/
      # and the real CSP from app/src-tauri/tauri.conf.json (csp_server.py
      # reads it directly) — a Critical CSP regression in an earlier task was
      # caught solely by this suite, not by the Rust tests above.
      - name: Frontend e2e (Playwright)
        working-directory: tests/frontend
        run: npm test

  windows-tests:
    name: Windows workspace tests
    # GitHub-hosted, deliberately not self-hosted: the former self-hosted fleet was
    # macOS/Linux only. This replaces what used to be a `cargo check --target
    # x86_64-pc-windows-msvc` cross-check inside rust-workspace above. That
    # check was only ever a proxy for "does this still compile on Windows",
    # and it failed on macOS for a toolchain reason, not a portability defect:
    # agentclient's reqwest/rustls-tls dependency pulls in `ring`, whose
    # build.rs compiles C sources that need Windows CRT headers macOS doesn't
    # have. A real Windows runner removes that gap entirely and verifies
    # strictly more than a cross-check ever could — it actually links and runs
    # the tests.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # GitHub-hosted runners are ephemeral (no persistent disk between runs,
      # unlike the self-hosted pool above), so caching matters more here, not
      # less — same action as the other two Rust jobs in this file, just
      # pointed at this job's own cache key via runner.os.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          workspaces: .

      # Full workspace, including app/src-tauri: windows-latest's runner image
      # ships the WebView2 Runtime, and tauri's build.rs/webview2-com resolve
      # the WebView2 SDK bindings themselves at build time, so no extra
      # apt/choco-equivalent setup should be needed — unlike Linux, which needs
      # webkit2gtk/appindicator system packages this repo doesn't install
      # anywhere. Narrow this to `-p solador-wire -p viewmodel -p agentclient`
      # if a real run shows app/src-tauri needs something this image doesn't
      # have, and say why in the job/PR rather than narrowing silently.
      - name: Test
        run: cargo test --locked --workspace
