name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Required for the merge queue: without this the queue builds a merge_group
  # ref, no check ever reports against it, and entries sit until they time out.
  merge_group:

# Least-privilege default token: jobs only read repo contents. Widen per-job if
# a future step needs more (e.g. packages: write).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only dedupe redundant PR runs. main pushes must each get a verdict, so a
  # follow-up push never cancels an in-flight main run (see run 27231906125).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift-tests:
    name: Swift app tests
    runs-on: [self-hosted, macOS, sassy-dog]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # XcodeGen emits the newest project format, so pair it with a pinned Xcode
      # that can read it. Both are pinned: a floating xcode-version or XcodeGen
      # is a silent build input (the .xcodeproj is gitignored).
      #
      # 26.4.1 is the ONLY Xcode installed on the org's self-hosted Mac, so the
      # pin has to match it — setup-xcode selects an installed version, it does
      # not download one. Bumped from 26.3 with this runner move; if another
      # version is ever added to the image, re-pin deliberately rather than
      # floating.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.4.1'

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # The .xcodeproj is generated (gitignored), so CI needs XcodeGen. Install a
      # pinned XcodeGen release (not the floating Homebrew formula) so the
      # generated project format cannot drift silently. xcbeautify is optional —
      # ./dev test uses it for nicer output if present.
      - name: Install XcodeGen (pinned)
        env:
          XCODEGEN_VERSION: '2.45.4'
        run: |
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo /tmp/xcodegen/xcodegen/install.sh /usr/local
          xcodegen --version

      - name: Install xcbeautify
        run: brew install xcbeautify

      # The HostMetricsKit SPM package is not part of the DevCanopy app scheme, so
      # `./dev test` never runs it (issue #28). Run it directly with `swift test`
      # so its suite — including the testCPUPercentBackwardsCounterDoesNotCrash
      # regression lock for the PID-reuse counter-underflow crash — actually
      # executes in CI. Uses the toolchain already pinned by setup-xcode above; no
      # XcodeGen/xcbeautify needed for SPM.
      - name: Run HostMetricsKit package tests
        run: swift test --package-path Packages/HostMetricsKit

      - name: Run tests
        run: ./dev test

      # Non-regression coverage gate (issue #19), modeled on Lupita's CI. `./dev
      # test` runs under CI=true, so test.sh emits build/TestResults.xcresult with
      # coverage enabled. We read the DevCanopy.app target's LINE coverage — the
      # production code — and fail if it drops below the floor. We deliberately
      # gate on the app target, not the JSON-wide `lineCoverage`, because the
      # latter folds in the test target's own ~97% and masks real product
      # regressions.
      #
      # FLOOR = 53. The floor MUST be calibrated against the value measured in
      # THIS CI environment, not a dev machine: headless CI doesn't exercise the
      # hardware-dependent metric paths (live IOKit/CPU/GPU sampling) that run
      # locally, so CI line coverage (~56%) sits ~10pts below a local run (~66%).
      # CI measured 55.90% at calibration; 53 leaves a ~3pt buffer for the
      # run-to-run jitter of the live-system sampling tests. Ratchet upward as
      # tests are added — do not lower it.
      - name: Coverage floor (DevCanopy.app line coverage)
        run: |
          FLOOR=53
          BUNDLE=build/TestResults.xcresult

          if [[ ! -d "$BUNDLE" ]]; then
            echo "::error::Coverage result bundle $BUNDLE not found — did ./dev test run with CI=true?"
            exit 1
          fi

          # xccov reports lineCoverage as a 0..1 fraction; scale to a percentage.
          COVERAGE=$(xcrun xccov view --report --json "$BUNDLE" \
            | jq '(.targets[] | select(.name == "DevCanopy.app") | .lineCoverage) * 100')

          if [[ -z "$COVERAGE" || "$COVERAGE" == "null" ]]; then
            echo "::error::Could not read DevCanopy.app line coverage from $BUNDLE"
            exit 1
          fi

          printf 'DevCanopy.app line coverage: %.2f%% (floor %s%%)\n' "$COVERAGE" "$FLOOR"

          if awk "BEGIN { exit !($COVERAGE < $FLOOR) }"; then
            echo "::error::Line coverage ${COVERAGE}% is below floor ${FLOOR}%"
            exit 1
          fi
          echo "::notice::Line coverage ${COVERAGE}% meets floor ${FLOOR}%"

  lint:
    name: Lint
    runs-on: [self-hosted, macOS, sassy-dog]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Pin SwiftLint to a specific release (not the floating Homebrew formula) so
      # the rule set can't drift silently and re-baseline us. Matches the local
      # toolchain (lint-baseline.json was generated with this version).
      - name: Install SwiftLint (pinned)
        env:
          SWIFTLINT_VERSION: '0.63.3'
        run: |
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o -q /tmp/swiftlint.zip -d /tmp/swiftlint
          # Invoke by absolute path everywhere: arm64 macOS runners preinstall a
          # Homebrew swiftlint in /opt/homebrew/bin, which shadows /usr/local/bin —
          # a bare `swiftlint` silently un-pins to whatever the image ships.
          # Assert the pin actually took so a shadow can never sneak back in.
          /tmp/swiftlint/swiftlint version
          [ "$(/tmp/swiftlint/swiftlint version)" = "${SWIFTLINT_VERSION}" ]

      - name: Run SwiftLint
        run: |
          # --strict fails on any NON-baselined violation. The baseline
          # (lint-baseline.json) holds pre-existing structural debt in the
          # absorbed HostMetricsKit code (large_tuple / cyclomatic_complexity /
          # file_length, etc.) so the gate enforces clean NEW code without
          # blocking on that legacy backlog. Shrink the baseline as that debt lands.
          /tmp/swiftlint/swiftlint lint --baseline lint-baseline.json --strict --reporter github-actions-logging

      # Pinned for reproducibility; matches the local toolchain that reformatted
      # the repo (config: .swiftformat).
      - name: Install SwiftFormat (pinned)
        env:
          SWIFTFORMAT_VERSION: '0.61.1'
        run: |
          curl -fsSL -o /tmp/swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -o -q /tmp/swiftformat.zip -d /tmp/swiftformat
          BIN=$(find /tmp/swiftformat -name swiftformat -type f -perm +111 | head -1)
          # Same shadow trap as SwiftLint above: keep the pinned binary at a
          # dedicated path and invoke it absolutely; assert the pin took.
          mkdir -p /tmp/swiftformat-bin
          mv "$BIN" /tmp/swiftformat-bin/swiftformat
          /tmp/swiftformat-bin/swiftformat --version
          [ "$(/tmp/swiftformat-bin/swiftformat --version)" = "${SWIFTFORMAT_VERSION}" ]

      - name: Run SwiftFormat (lint)
        run: |
          # Blocking: fails on any formatting violation. New code must stay
          # formatted to .swiftformat.
          /tmp/swiftformat-bin/swiftformat --lint .

  agent-tests:
    name: Rust agent
    # dtolnay/rust-toolchain installs into $HOME, so it needs no root — which is
    # what makes this job portable to the fleet (the image ships no rustup/cargo
    # and the runner is non-root with no sudo).
    runs-on: [self-hosted, linux, sassy-dog]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Toolchain version is pinned in agent/rust-toolchain.toml; this action
      # honors it. Pinned to the stable-channel action at a fixed commit.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: agent

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --verbose

      - name: Test
        run: cargo test --locked --verbose

  rust-workspace:
    name: Rust workspace + frontend e2e
    # The Tauri app (app/src-tauri) only builds on macOS/Windows targets, and the
    # frontend suite needs a real WebView-capable desktop to serve/build against,
    # so this runs on the same self-hosted Mac pool as swift-tests/lint rather
    # than the Linux pool agent-tests uses.
    runs-on: [self-hosted, macOS, sassy-dog]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # No rust-toolchain.toml at the workspace root (unlike agent/), so this
      # floats to whatever "stable" resolves to when the job runs — same as
      # dtolnay/rust-toolchain@stable elsewhere in this file. Reusing that
      # action here (rather than a raw `rustup toolchain install`) keeps this
      # job portable to a fleet image with no pre-installed rustup, matching
      # the reasoning already pinned on the agent-tests job above.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: .

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Node/Playwright is the only npm in the repo (tests/frontend/package.json).
      # cache: npm speeds up repeat runs the same way Swatinem/rust-cache does
      # for cargo above.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json

      - name: Install frontend test dependencies
        working-directory: tests/frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: tests/frontend
        run: npx playwright install chromium

      # `npm test`'s `pretest` script builds devcanopy-app and runs its --dump
      # mode to (re)generate the gitignored app/ui/sample.json fixture the
      # suite serves, so the build always happens before Playwright runs
      # against it — npm's pretest/test ordering is what enforces that, not
      # step order here. This suite is the only thing that exercises app/ui/
      # and the real CSP from app/src-tauri/tauri.conf.json (csp_server.py
      # reads it directly) — a Critical CSP regression in an earlier task was
      # caught solely by this suite, not by the Rust tests above.
      - name: Frontend e2e (Playwright)
        working-directory: tests/frontend
        run: npm test

  windows-tests:
    name: Windows workspace tests
    # GitHub-hosted, deliberately not self-hosted: the sassy-dog fleet is
    # macOS/Linux only. This replaces what used to be a `cargo check --target
    # x86_64-pc-windows-msvc` cross-check inside rust-workspace above. That
    # check was only ever a proxy for "does this still compile on Windows",
    # and it failed on macOS for a toolchain reason, not a portability defect:
    # agentclient's reqwest/rustls-tls dependency pulls in `ring`, whose
    # build.rs compiles C sources that need Windows CRT headers macOS doesn't
    # have. A real Windows runner removes that gap entirely and verifies
    # strictly more than a cross-check ever could — it actually links and runs
    # the tests.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # GitHub-hosted runners are ephemeral (no persistent disk between runs,
      # unlike the self-hosted pool above), so caching matters more here, not
      # less — same action as the other two Rust jobs in this file, just
      # pointed at this job's own cache key via runner.os.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: .

      # Full workspace, including app/src-tauri: windows-latest's runner image
      # ships the WebView2 Runtime, and tauri's build.rs/webview2-com resolve
      # the WebView2 SDK bindings themselves at build time, so no extra
      # apt/choco-equivalent setup should be needed — unlike Linux, which needs
      # webkit2gtk/appindicator system packages this repo doesn't install
      # anywhere. Narrow this to `-p metrics -p viewmodel -p agentclient` only
      # if a real run shows app/src-tauri needs something this image doesn't
      # have, and say why in the job/PR rather than narrowing silently.
      - name: Test
        run: cargo test --workspace
