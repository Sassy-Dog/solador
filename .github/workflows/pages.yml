# solador.app: publishes site/ to GitHub Pages.
#
# The site is static (no build step, the same rule as app/ui), so "build" is
# packaging the directory as a Pages artifact and "deploy" hands that artifact
# to Pages. Deploying needs no repository credential at all: `deploy-pages`
# authenticates with this job's OIDC token (`id-token: write`), which GitHub
# scopes to the `github-pages` environment. That is why secrets-guard.sh needs
# no allowance for this file.
#
# The custom domain lives in the repository's Pages settings, not in a CNAME
# file: an Actions-deployed site ignores one. Product screenshots are in
# site/assets/screenshots/, written by `npm run screenshots` (tests/frontend).
#
# Not a required check, so the `paths` filter is safe here in a way it would
# not be on ci.yml: a skipped run of this workflow leaves nothing pending.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one mid-flight: a cancelled
# deploy can leave Pages serving a half-switched site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Package site/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
