name: Release

# The release builds: the signed, notarized, stapled macOS bundle (#307, part
# of #15) and the Authenticode-signed Windows installer (#341, signed via
# Azure Trusted Signing in #342).
#
# These are the ONLY jobs in this repository that declare an environment, and
# that is the whole security design rather than a detail. Solador is a PUBLIC
# repo, so the org's `APPLE_*` secrets — which are `private` visibility — are
# unreachable here and would resolve to the empty string. Environment secrets
# are repo-scoped, so `private` visibility never applies to them; `prd` also
# carries a required reviewer and a `v*`-tag-only deployment policy, which is
# what stops a push to `main` from quietly minting a signed build.
#
# `ci.yml` declares no environment and references zero secrets, asserted by
# this repo's `secrets-guard` job rather than assumed. Keep it that way: a
# fork's pull request runs CI.
#
# Verified end to end by a real tagged run — a green lint on this file proves
# nothing about signing, because signing needs credentials and makes real
# submissions to Apple.

on:
  push:
    tags: ['v*']

# Needed to create the draft release and upload the artifacts to it. Every
# other workflow in this repo stays `contents: read`.
permissions:
  contents: write

jobs:
  release:
    name: Signed release build
    runs-on: macos-latest
    environment: prd

    env:
      APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
      APPLE_ASC_KEY_BASE64: ${{ secrets.APPLE_ASC_KEY_BASE64 }}
      APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
      APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
      APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Read at COMPILE time by `crashreport::BUILD_DSN` (`option_env!`), so it
      # has to be in the environment cargo is invoked with — it is never a flag
      # to build.sh, which does not name it at all.
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      # The updater signing key (#308). `build.sh`'s `make_updater_archive`
      # reads both, through the pinned Tauri CLI's own signer, to minisign the
      # `.app.tar.gz` the in-app updater downloads.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MANDATORY, not an optimization. Both version numbers are derived by
          # counting git history, and `get-version-info.sh` REFUSES on a shallow
          # clone rather than answering "commits this month" with 1. At depth 1
          # this job would emit no version at all.
          fetch-depth: 0

      # FIRST, before anything expensive, and before the keychain exists.
      #
      # This is the failure this entire credential design exists to prevent: an
      # unreachable secret resolves to the EMPTY STRING and never raises. Skip
      # this check and a misconfigured environment does not fail here — it fails
      # minutes later inside codesign or notarytool, with a message that never
      # mentions a secret, or worse it does not fail at all and publishes an
      # unsigned artifact.
      - name: Preflight — every release secret must be non-empty
        run: |
          missing=()
          for name in \
            APPLE_ASC_ISSUER_ID APPLE_ASC_KEY_BASE64 APPLE_ASC_KEY_ID \
            APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64 \
            APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD \
            APPLE_KEYCHAIN_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID \
            SENTRY_DSN TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::${#missing[@]} release secret(s) resolved EMPTY: ${missing[*]}"
            echo "Most likely cause: this job lost 'environment: prd', or the Doppler" >&2
            echo "solador/prd -> GitHub environment sync is broken. Secrets are never" >&2
            echo "readable outside the environment, by design (#305)." >&2
            exit 1
          fi
          echo "All 11 release secrets resolved."

      # The tag names the artifact; the build DERIVES its version from history.
      # Nothing forces those to agree, so assert it. Without this, hand-tagging
      # v2026.8.5 at a commit whose derived CalVer is 2026.8.109 publishes a
      # release called v2026.8.5 containing Solador-2026.8.109.dmg — a
      # mislabelled artifact is worse than a failed release.
      - name: Assert the tag matches the derived CalVer
        run: |
          derived="v$(scripts/get-version-info.sh --version)"
          if [[ "$GITHUB_REF_NAME" != "$derived" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match derived version $derived"
            echo "Tags are minted by scripts/publish.sh so these agree. A hand-made" >&2
            echo "tag, or a tag on the wrong commit, lands here." >&2
            exit 1
          fi
          echo "Tag and derived version agree: $derived"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Both slices of the universal bundle (#335). v2026.8.110 shipped
          # arm64-only because no target was named here or in build.sh.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Also caches ~/.cargo/bin, where build.sh installs the pinned cargo-tauri.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          workspaces: .

      # build.sh deliberately does NOT manage keychains — it resolves an
      # identity out of whatever is already there. On a hosted runner there is
      # nothing there, so importing is this workflow's job.
      - name: Import the signing certificate into a temporary keychain
        run: |
          # Recomputed here rather than carried in the job's `env:` — the
          # `runner` context is not available at job-env scope, only the
          # RUNNER_TEMP variable inside a step. The delete step below builds
          # the identical path for the same reason.
          KEYCHAIN_PATH="$RUNNER_TEMP/solador-signing.keychain-db"
          cert="$RUNNER_TEMP/cert.p12"
          ( umask 077; printf '%s' "$APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64" | base64 --decode > "$cert" )

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Disable the 300s auto-lock: a release build runs far longer than
          # that, and a keychain that re-locks mid-build fails at codesign.
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$cert" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm -f "$cert"

          # Without this, codesign blocks on a GUI authorization prompt that can
          # never be answered on a headless runner, and the job hangs until it
          # times out rather than failing.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # Prepend to the search list, keeping the existing entries.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/[[:space:]"]//g')

          # Prove the identity actually landed. `security import` can succeed
          # while leaving nothing codesign will use, and the next honest signal
          # would otherwise be a confusing failure inside build.sh.
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
               | grep -q "Developer ID Application"; then
            echo "::error::no 'Developer ID Application' identity in the imported keychain"
            exit 1
          fi
          echo "Signing identity imported."

      # --notarize implies --sign. This is the same command a maintainer runs
      # locally, which is what keeps the release path from drifting away from
      # the one people actually exercise.
      - name: Build, sign, notarize, staple
        run: ./dev build --release --notarize

      # build.sh asserts its own work. This re-checks the FILE THAT SHIPS,
      # which is a different claim.
      - name: Validate the artifact that will be uploaded
        id: artifact
        run: |
          shopt -s nullglob
          # Beneath the triple: bundles are universal (#335), and `--target`
          # moves cargo's output. Kept in step with MACOS_UNIVERSAL_TARGET in
          # scripts/config.sh, which YAML cannot source.
          dmgs=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "::error::expected exactly one .dmg, found ${#dmgs[@]}"
            exit 1
          fi
          dmg="${dmgs[0]}"
          xcrun stapler validate "$dmg"
          spctl -a -vvv --type install "$dmg" 2>&1 | tee /dev/stderr | grep -q "source=Notarized Developer ID"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "Validated $(basename "$dmg") ($(du -h "$dmg" | cut -f1))"

          # The updater payload (#308). A .dmg is not an update: macOS applies a
          # `.app.tar.gz`, so both ship — the disk image for a human, the
          # tarball for `tauri-plugin-updater`. build.sh already asserted the
          # archive's contents; this re-checks that the two files a release
          # needs actually exist, because a release missing them publishes an
          # un-updatable version and nothing else would say so.
          tarballs=(target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "::error::expected exactly one .app.tar.gz, found ${#tarballs[@]}"
            exit 1
          fi
          tarball="${tarballs[0]}"
          if [[ ! -s "$tarball.sig" ]]; then
            echo "::error::$tarball has no minisign signature beside it"
            echo "(TAURI_SIGNING_PRIVATE_KEY resolved empty, or the signer failed)" >&2
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Validated $(basename "$tarball") ($(du -h "$tarball" | cut -f1)) + .sig"

      # DRAFT deliberately. The reviewer gate approved exposing credentials, not
      # publishing to users — a draft is deletable, a public release has to be
      # retracted.
      #
      # It is also what the update feed hangs off: a draft's assets are not
      # publicly downloadable and the draft is not attached to its tag, so a
      # manifest pointing into one would 404 for every client. `publish-feed.yml`
      # therefore runs on `release: published`, which makes "a draft can never
      # serve updates" a property of the trigger rather than a rule to remember
      # (#308).
      - name: Attach the .dmg and the updater payload to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.artifact.outputs.dmg }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG" "$TARBALL" "$TARBALL.sig" --clobber
            echo "Uploaded to the existing $GITHUB_REF_NAME release."
          else
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
              --title "$GITHUB_REF_NAME" "$DMG" "$TARBALL" "$TARBALL.sig"
            echo "Created draft release $GITHUB_REF_NAME. Publish it when you are happy."
            echo "Publishing is what generates and uploads latest.json (publish-feed.yml)."
          fi

      # always(): a failed build must not leave the signing identity sitting in
      # a keychain. The runner is ephemeral, so this is belt-and-braces — but it
      # is also the step that makes the intent reviewable.
      - name: Delete the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/solador-signing.keychain-db" || true

  release-windows:
    name: Windows release build (signed installer)
    runs-on: windows-latest
    # Same gate as the macOS job, and since #342 for the same reason: this
    # leg signs. The Trusted Signing credential is not a secret at all but a
    # federated identity whose subject is
    # `repo:Sassy-Dog/solador:environment:prd` — the OIDC exchange in
    # azure/login below succeeds ONLY for a job running in this environment,
    # which makes "a push to main cannot mint a signed build" a property of
    # Entra's trust configuration rather than of this file. SENTRY_DSN
    # additionally is an environment secret and is compiled in, so a release
    # Windows binary built outside `prd` would silently ship without crash
    # reporting.
    environment: prd

    # Job-level rather than workflow-level, because job permissions REPLACE
    # the workflow's block: `contents: write` must be restated for the draft
    # release upload, and `id-token: write` is what lets azure/login request
    # the OIDC token that workload identity federation exchanges for the
    # signing credential. The macOS job needs no Azure token, so it keeps the
    # narrower workflow-level grant.
    permissions:
      contents: write
      id-token: write

    # Every scripted step below is the same bash the rest of this repo runs —
    # `./dev` and scripts/*.sh are bash, and Git Bash is what `shell: bash`
    # resolves to on a windows-* runner.
    defaults:
      run:
        shell: bash

    env:
      # Read at COMPILE time by `crashreport::BUILD_DSN` (`option_env!`) —
      # same note as the macOS job above.
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      # Consumed by azure/login's `with:` below, not by any build step — the
      # three ride the job env only so the preflight can prove they resolved
      # non-empty BEFORE an expensive build. None is sensitive on its own
      # (they are ids, not keys); the signing capability lives in the
      # federated identity, which never materialises as a secret.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      # BEFORE checkout. The runner image sets core.autocrlf=true, so every
      # file git classifies as text would arrive CRLF — including `dev` and
      # scripts/*.sh, which bash then reads with a literal \r on every line.
      # .gitattributes deliberately protects only the signature-covered
      # fixtures (its header explains why it is not a repo-wide line-ending
      # policy); the scripts are protected here, at the only place a Windows
      # checkout executes them.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf input

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same as the macOS job: both version numbers are derived by
          # counting git history, so a shallow clone derives nonsense.
          fetch-depth: 0

      # Same shape as the macOS preflight, scoped to the four secrets this leg
      # consumes: an unreachable secret resolves to the EMPTY STRING and never
      # raises. `option_env!` would happily compile SENTRY_DSN's absence in,
      # and azure/login handed an empty client-id fails much later inside the
      # signing step with an auth error that never mentions a secret — or
      # worse, a misconfiguration that skipped signing would publish an
      # unsigned installer whose only symptom is a SmartScreen warning on
      # users' machines, exactly what #342's acceptance forbids.
      - name: Preflight — every release secret must be non-empty
        run: |
          missing=()
          for name in SENTRY_DSN AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::${#missing[@]} release secret(s) resolved EMPTY: ${missing[*]}"
            echo "Most likely cause: this job lost 'environment: prd', or the secrets" >&2
            echo "were set at repo scope instead of on the environment. Secrets are" >&2
            echo "never readable outside the environment, by design (#305)." >&2
            exit 1
          fi
          echo "All 4 Windows release secrets resolved."

      # Same assertion as the macOS job, and it must run on BOTH legs: each
      # publishes an artifact under the tag's name, so each has to prove the
      # tag and the derived version agree.
      - name: Assert the tag matches the derived CalVer
        run: |
          derived="v$(bash scripts/get-version-info.sh --version)"
          if [[ "$GITHUB_REF_NAME" != "$derived" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match derived version $derived"
            echo "Tags are minted by scripts/publish.sh so these agree. A hand-made" >&2
            echo "tag, or a tag on the wrong commit, lands here." >&2
            exit 1
          fi
          echo "Tag and derived version agree: $derived"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # The one Windows target (#341) — a separate --target, never a
          # second slice of the macOS universal story (#335). build.sh also
          # installs it itself; naming it here just lets the toolchain action
          # do it once, before the cache step.
          targets: x86_64-pc-windows-msvc

      # Also caches ~/.cargo/bin, where build.sh installs the pinned
      # cargo-tauri.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1
        with:
          workspaces: .

      # The same command a maintainer would run — build.sh derives both
      # version numbers from git, bundles via `cargo tauri build --bundles
      # nsis`, and asserts both numbers back out of the installer's version
      # resource. It produces an UNSIGNED installer on every machine, CI
      # included: Authenticode is applied to the finished file in the steps
      # below rather than through Tauri's in-bundle NSIS `signCommand` hook,
      # mirroring the macOS division of labour — finish the artifact, sign
      # the exact file that ships, assert the signature back out of it. A
      # signCommand would additionally sign the app binary inside the
      # installer, but the file SmartScreen actually evaluates is the
      # MotW-carrying download (this installer), updater payloads are
      # minisign-verified regardless (#308), and threading a CI-only
      # signCommand through build.sh's `--config` overlay would make the
      # build behave differently in CI than anywhere else — the drift the
      # "same command a maintainer runs" rule exists to prevent.
      - name: Build the NSIS installer (unsigned until the next step)
        run: ./dev build --release

      # Minted AFTER the long build, immediately before its only consumer:
      # the federated session is an access token with an expiry, not a
      # refreshable login, and a token requested before a long compile could
      # age out before the signing call uses it. The exchange itself is the
      # environment gate — see the job comment above.
      - name: Azure login (workload identity federation)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Signs the exact file build.sh produced (already renamed and
      # version-asserted). The folder glob is safe because build.sh
      # guarantees exactly one `*-setup.exe` here — it deletes the directory
      # before bundling. Authenticode appends to the PE and does not touch
      # the VERSIONINFO resource the validate step below re-reads. The action
      # authenticates via DefaultAzureCredential, whose only non-excluded
      # entry that can succeed on this runner is AzureCliCredential — i.e.
      # the azure/login session above; with a broken login the signing call
      # FAILS, it never soft-skips. The RFC 3161 timestamp is load-bearing:
      # Trusted Signing certificates are short-lived by design, and an
      # untimestamped signature would die with its certificate.
      - name: Authenticode-sign the installer (Azure Trusted Signing)
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: tsa-sassydog
          certificate-profile-name: solador-public-trust
          files-folder: ${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\bundle\nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # build.sh asserts its own work. This re-checks the FILE THAT SHIPS,
      # which is a different claim — same division of labor as the macOS job.
      - name: Validate the artifact that will be uploaded
        id: artifact
        run: |
          shopt -s nullglob
          # Beneath the triple: `--target` moves cargo's output. Kept in step
          # with WINDOWS_TARGET in scripts/config.sh, which YAML cannot source.
          exes=(target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          if [[ ${#exes[@]} -ne 1 ]]; then
            echo "::error::expected exactly one NSIS installer, found ${#exes[@]}"
            exit 1
          fi
          exe="${exes[0]}"

          # An independent second read of the version resource — the fixed
          # VS_FIXEDFILEINFO block carries the marketing version in words 1-3
          # and the build number in word 4 (see build.sh's Windows section).
          want="$(bash scripts/get-version-info.sh --version).$(bash scripts/get-build-number.sh)"
          got="$(powershell.exe -NoProfile -Command \
            "\$v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo('$(cygpath -w "$exe")'); '{0}.{1}.{2}.{3}' -f \$v.ProductMajorPart, \$v.ProductMinorPart, \$v.ProductBuildPart, \$v.ProductPrivatePart" \
            | tr -d '\r')"
          if [[ "$got" != "$want" ]]; then
            echo "::error::installer ProductVersion is '$got', expected '$want'"
            exit 1
          fi

          # The signature is asserted from the artifact, never inferred from
          # the signing step's exit code — the same claim-splitting as the
          # macOS `codesign`/`spctl` re-read. Get-AuthenticodeSignature
          # re-hashes the file and walks the chain: Status catches a missing
          # or broken signature, the subject check catches signing with the
          # wrong certificate profile, and the timestamper check catches a
          # signature that would expire with the short-lived Trusted Signing
          # certificate.
          sig="$(powershell.exe -NoProfile -Command \
            "\$s = Get-AuthenticodeSignature -LiteralPath '$(cygpath -w "$exe")'; '{0}|{1}|{2}' -f \$s.Status, \$s.SignerCertificate.Subject, [bool]\$s.TimeStamperCertificate" \
            | tr -d '\r')"
          IFS='|' read -r sig_status sig_subject sig_timestamped <<< "$sig"
          if [[ "$sig_status" != "Valid" ]]; then
            echo "::error::Authenticode status is '${sig_status:-<none>}', expected 'Valid' — the file that would ship is unsigned or corrupt"
            exit 1
          fi
          if [[ "$sig_subject" != *"Sassy Dog Enterprises LLC"* ]]; then
            echo "::error::signer subject is '$sig_subject' — not the Sassy Dog Enterprises LLC certificate profile"
            exit 1
          fi
          if [[ "$sig_timestamped" != "True" ]]; then
            echo "::error::signature carries no RFC 3161 timestamp — it would expire with the short-lived signing certificate"
            exit 1
          fi
          echo "Authenticode: $sig_status, signer '$sig_subject', timestamped"
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          echo "Validated $(basename "$exe") ($(du -h "$exe" | cut -f1)), ProductVersion $got"

      # Same draft-release destination as the macOS job. Both legs run in
      # parallel and either may get here first, so both use the same
      # view-then-create pattern — with a fallback for the race where both
      # observe "no release yet" and the create loses: `gh release create`
      # fails on an existing release rather than uploading to it.
      - name: Attach the installer to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          EXE: ${{ steps.artifact.outputs.exe }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$EXE" --clobber
            echo "Uploaded to the existing $GITHUB_REF_NAME release."
          elif gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
              --title "$GITHUB_REF_NAME" "$EXE"; then
            echo "Created draft release $GITHUB_REF_NAME. Publish it when you are happy."
          else
            gh release upload "$GITHUB_REF_NAME" "$EXE" --clobber
            echo "Lost the create race to the macOS job — uploaded to its release."
          fi

          # Say the installer is signed IN the notes rather than leaving
          # users to discover it via SmartScreen (#342). This runs after
          # every branch above because either leg may have created the
          # release and only this one knows the Windows artifact is signed;
          # the substring guard keeps a re-run (the --clobber path) from
          # stacking duplicates. Prepending is race-safe: the macOS leg
          # never edits the body.
          note="The Windows installer is Authenticode-signed via Azure Trusted Signing (publisher: Sassy Dog Enterprises LLC) and RFC 3161-timestamped. The macOS disk image is Developer ID-signed and notarized."
          body="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
          if [[ "$body" != *"Authenticode-signed"* ]]; then
            gh release edit "$GITHUB_REF_NAME" --notes "$note"$'\n\n'"$body"
          fi
