version: 2
updates:
  # Rust agent crates (98 locked deps in agent/Cargo.lock).
  - package-ecosystem: cargo
    directory: /agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope

  # Root Rust workspace: crates/{wire,viewmodel,agentclient} + app/src-tauri
  # (473 locked deps -- ring, rustls, reqwest, tauri, keyring among them).
  # Separate entry from /agent: distinct Cargo.lock, distinct toolchain pin
  # (rust-toolchain.toml).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope

  # Playwright frontend e2e suite (tests/frontend/package-lock.json).
  - package-ecosystem: npm
    directory: /tests/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions — keep the SHA-pinned action refs current. Dependabot updates
  # both the pin and the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
