version: 2
# Minor and patch bumps arrive as ONE weekly PR per ecosystem (`groups`),
# rather than one PR per dependency: nine single-dependency PRs a week was
# more review than the bumps were worth. Majors are left out of every group,
# so each still gets a PR -- and a review -- of its own.
updates:
  # The whole Rust workspace: crates/*, app/src-tauri and agent, against one
  # Cargo.lock. This was two entries -- /agent kept its own lockfile and
  # toolchain pin -- until the agent joined the root workspace. One lockfile
  # means one entry; a second pointing at /agent would now find no manifest of
  # its own to resolve.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  # Playwright frontend e2e suite (tests/frontend/package-lock.json).
  - package-ecosystem: npm
    directory: /tests/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions — keep the SHA-pinned action refs current. Dependabot updates
  # both the pin and the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
