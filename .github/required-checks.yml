# Checks that must pass before a PR merges to the default branch.
#
# Hand-maintained. This used to be rendered into the branch ruleset by an
# internal automation repo that no longer applies here, so the ruleset and this
# file are now kept in step by a person: change one, change the other.
#
# The `context` strings must match the job `name:` values in ci.yml exactly —
# a ruleset waits forever on a context no job reports. `satisfies` records
# which category each check covers, so a future job can be added without
# rediscovering why these three exist.
required_checks:
  - context: "Rust agent"
    satisfies: [lint, unit]
  - context: "Rust workspace + frontend e2e"
    satisfies: [lint, unit, e2e]
  - context: "Windows workspace tests"
    satisfies: [unit]
  # Added by #303. The bundle path is the one place where "all green" carried
  # no information until this job existed — it is the #269 shape, and it is
  # only a gate if the ruleset actually requires it.
  #
  # ORDER MATTERS on adoption: add this context to the ruleset only AFTER this
  # lands on main. A required context that no job reports blocks every PR whose
  # base predates the job, and the queue waits forever rather than failing.
  - context: "macOS bundle (unsigned)"
    satisfies: [bundle]
  # Added by #307. release.yml is the only workflow allowed to read a secret,
  # because it is the only one declaring `environment: prd`. That property is
  # invisible when it breaks — an unreachable secret resolves to the empty
  # string — and this repo is public, so ci.yml runs on fork pull requests.
  # Asserted, per #307's acceptance, rather than assumed.
  #
  # SAME ORDERING TRAP as the bundle job above: add this context to the ruleset
  # only AFTER it lands on main, or every PR whose base predates the job waits
  # forever on a context nothing reports.
  - context: "Secrets guard"
    satisfies: [security]
