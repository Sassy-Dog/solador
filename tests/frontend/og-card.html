<!doctype html>
<!--
  The 1200×630 social card (site/assets/og.png), rendered by
  screenshots.spec.js from this page. Not shipped: it is a picture-making
  template, which is why it may carry inline styles the site's CSP forbids.
  Its images resolve against site/ through the spec's route, so the card is
  built from the same mark and the same showcase screenshot the site serves.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(90% 120% at 100% 0%, rgb(30 79 160 / 0.45), transparent 60%),
        #070b13;
      color: #ede8de;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .copy {
      position: absolute;
      top: 72px;
      left: 72px;
      width: 470px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 34px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .brand img { width: 56px; height: 56px; }
    h1 {
      margin: 44px 0 0;
      font-size: 54px;
      line-height: 1.08;
      font-weight: 650;
      letter-spacing: -0.025em;
    }
    p {
      margin: 22px 0 0;
      color: #9caec5;
      font-size: 22px;
      line-height: 1.45;
    }
    .url {
      position: absolute;
      left: 72px;
      bottom: 60px;
      color: #f2ba63;
      font: 500 22px/1 ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    }
    .shot {
      position: absolute;
      top: 80px;
      left: 610px;
      width: 760px;
      border: 1px solid #2a374c;
      border-radius: 14px;
      box-shadow: 0 30px 80px -20px rgb(30 79 160 / 0.55), 0 18px 40px -24px rgb(0 0 0 / 0.9);
      transform: rotate(-3deg);
    }
  </style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="/assets/mark.svg" alt=""> Solador</div>
    <h1>Everything around your code, at a glance.</h1>
    <p>Machines, CI, containers, spend, vendor status and agents, on your second monitor.</p>
  </div>
  <div class="url">solador.app</div>
  <img class="shot" src="/assets/screenshots/overview.png" alt="">
</body>
</html>
