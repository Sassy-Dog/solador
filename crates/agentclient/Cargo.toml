[package]
name = "agentclient"
version = "0.1.0"
edition.workspace = true

[dependencies]
metrics = { path = "../metrics" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = { workspace = true }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
