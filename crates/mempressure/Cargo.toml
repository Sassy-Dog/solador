[package]
name = "solador-mempressure"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "mempressure"

[target.'cfg(target_os = "macos")'.dependencies]
# One `sysctlbyname` query, shared by the local cockpit and the remote agent.
# `libc` is already in the lockfile (the agent depends on it); no sampler,
# sysinfo or battery dependency comes with it.
libc = "0.2"
