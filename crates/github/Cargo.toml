[package]
# Prefixed like `solador-wire`/`solador-store` to stay clear of the popular
# `github` name on crates.io. The lib below keeps the short import name.
name = "solador-github"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "github"

[dependencies]
# The stock message vocabulary (#354). A leaf crate with no dependencies of its
# own, so this edge costs nothing — and it is not a dependency on the panel
# layer: `viewmodel` re-exports the same enum rather than owning it.
solador-fault = { path = "../fault" }
serde = { workspace = true }
serde_json = { workspace = true }
# Same HTTP stack (and feature set) as crates/agentclient, so the workspace
# resolves one reqwest and one TLS backend.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `join3` for the per-repo side counts the original fires with `async let`.
# Already in the lock via reqwest/tauri — a new edge, not a new package.
futures-util = "0.3"
# GitHub timestamps are RFC 3339 strings and the stuck/presence clocks are
# instant arithmetic. Already in the lock via tauri's tree.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
thiserror = "2"
# The vendor-neutral status vocabulary and its three transports. `conjunction`
# lives here rather than there because it needs `RunnerSummary`.
solador-servicestatus = { path = "../servicestatus" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
