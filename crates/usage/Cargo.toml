[package]
# Prefixed like `solador-wire`/`solador-github` to stay clear of the popular
# `usage` name on crates.io. The lib below keeps the short import name.
name = "solador-usage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "usage"

[dependencies]
# The stock message vocabulary (#354). A leaf crate with no dependencies of its
# own, so this edge costs nothing — and it is not a dependency on the panel
# layer: `viewmodel` re-exports the same enum rather than owning it.
solador-fault = { path = "../fault" }
serde = { workspace = true }
serde_json = { workspace = true }
# Same HTTP stack (and feature set) as crates/agentclient and crates/github, so
# the workspace resolves one reqwest and one TLS backend.
# `gzip` is for Vercel's FOCUS export and nothing else: seven days of charges
# is 3.4 MB uncompressed and 85 KB gzipped, measured live. Without the feature
# the `Accept-Encoding` header the client sends is inert.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
# Log timestamps are RFC 3339 strings and every window is instant arithmetic.
# Deliberately without the `clock` feature: nothing here reads the wall clock —
# `now` is always an argument, as in crates/github.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
# Home directory for the default Claude log root (`~/.claude/projects` on macOS,
# `%USERPROFILE%\.claude\projects` on Windows). Already a workspace dependency.
dirs = { workspace = true }
# Percent-encodes the Sentry org slug and the Neon org id before either lands in
# a path segment (see `src/urlpath.rs`).
# Already in the lock via reqwest's `url` tree — a new edge, not a new package.
percent-encoding = "2"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
# Temp dirs for the log-walker tests, so the default `~/.claude/projects` root
# is never touched and the suite runs the same on macOS and Windows CI.
tempfile = "3"
