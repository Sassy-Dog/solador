[package]
# Prefixed like `solador-wire`/`solador-store` to stay clear of the generic
# name on crates.io. The lib below keeps the short import name.
name = "solador-servicestatus"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "servicestatus"

[dependencies]
# The stock message vocabulary (#354). A leaf crate with no dependencies of its
# own, so this edge costs nothing — and it is not a dependency on the panel
# layer: `viewmodel` re-exports the same enum rather than owning it.
solador-fault = { path = "../fault" }
serde_json = { workspace = true }
# Same HTTP stack (and feature set) as crates/github, so the workspace resolves
# one reqwest and one TLS backend.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
