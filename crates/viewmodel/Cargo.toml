[package]
name = "viewmodel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# The stock message vocabulary. It lived in this crate until #354 moved it down
# to a leaf crate every vendor crate can also point at; `src/fault.rs`
# re-exports it, so the name #352 introduced still resolves.
solador-fault = { path = "../fault" }
serde = { workspace = true }
serde_json = { workspace = true }
solador-wire = { path = "../wire" }
# The SAME comparator `tauri-plugin-updater` uses, at the same `^1` requirement
# it declares, so cargo unifies them to ONE crate. `update::is_newer` replaces
# the plugin's own version comparison (#353), and a second implementation of
# version ordering could disagree with the one that would otherwise have run —
# the reasoning `crates/updatefeed` takes `minisign-verify` for.
semver = "1"
