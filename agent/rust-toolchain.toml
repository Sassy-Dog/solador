# Pin the Rust toolchain so CI (and local `cargo` in agent/) is deterministic.
# Without this, dtolnay/rust-toolchain@stable floats to whatever the latest
# six-week release is, and `cargo clippy -- -D warnings` can red-mark untouched
# code on a release this repo never changed. Bump deliberately via Dependabot/PR.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
