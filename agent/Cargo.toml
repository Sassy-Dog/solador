[package]
name = "solador-agent"
# 0.4.0: `gpu` is measured on hosts with an NVIDIA card, via `nvidia-smi`
# (#217). A minor, not a patch: this agent produces a wire field it has never
# produced before. Still omitted everywhere nothing is measured.
# 0.3.1: `processes[]` lists processes only — Linux threads and kernel threads
# are no longer reported as processes of their own (#211).
# 0.3.0: `/v1/snapshot` stops emitting figures it never measured (#183) — the
# keys are omitted instead. `/v1/health`'s `version` is how you tell a
# redeployed agent from one still sending the old zeros (or, now, the old
# fabricated thread rows).
version = "0.4.0"
edition = "2021"
description = "Per-host metrics agent polled by Solador over Tailscale"
license = "MIT"

[[bin]]
name = "solador-agent"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
# The wire contract itself. One definition, shared with the app.
solador-wire = { path = "../crates/wire" }
serde_json = "1"
# Same explicit feature set as crates/localhost, not sysinfo's defaults.
# Both are workspace members now, and cargo unifies features across a workspace
# build -- so leaving this on defaults would silently hand `components` and
# `users` back to crates/localhost, whose manifest turns them off on purpose.
# One sysinfo configuration for the whole repo, which is what that comment
# always intended. The agent uses System/Disks/Networks and nothing else.
sysinfo = { version = "0.39", default-features = false, features = [
  "system",
  "disk",
  "network",
] }
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# `ServiceExt::oneshot` drives the router in auth middleware tests.
tower = { version = "0.5", features = ["util"] }

