[package]
name = "solador-agent"
# NOT the version this agent ships under, and not the version it reports.
#
# Since #390 the agent is a PUBLISHED artifact on the same GitHub Release as
# the cockpit, carrying the repo's CalVer — derived by
# `scripts/get-version-info.sh`, compiled in by `build.rs`, printed by
# `--version` and served at `/v1/health`. `docs/VERSIONING.md` reclassifies the
# agent accordingly; this number stopped being a release version there.
#
# It survives as the **wire-contract marker** the log below has always been: a
# minor here records a key this agent has never produced before, which is what
# `crates/wire`'s tolerance notes cite. Nothing reads it at runtime any more —
# `crate_version()` left `agent/deploy/lib.sh` with it — so keep bumping it for
# the contract, never for a release.
# 0.5.0: `processes[].cpuCores` (#378). A minor for the same reason 0.4.0 was:
# a wire field this agent has never produced before. It also FIXES what
# `cpuPercent` carries on Linux — the process refresh has its own sysinfo
# `System` now, so a 60-second numerator is no longer divided by a 1-second
# denominator (60x, measured at 210.8% for a process using 3.55% of one core).
# The new key is the version signal a consumer reads: absent means an agent
# whose `cpuPercent` is still inflated, and the row renders `—`.
# 0.4.0: `gpu` is measured on hosts with an NVIDIA card, via `nvidia-smi`
# (#217). A minor, not a patch: this agent produces a wire field it has never
# produced before. Still omitted everywhere nothing is measured.
# 0.3.1: `processes[]` lists processes only — Linux threads and kernel threads
# are no longer reported as processes of their own (#211).
# 0.3.0: `/v1/snapshot` stops emitting figures it never measured (#183) — the
# keys are omitted instead. `/v1/health`'s `version` is how you tell a
# redeployed agent from one still sending the old zeros (or, now, the old
# fabricated thread rows).
version = "0.5.0"
edition = "2021"
description = "Per-host metrics agent polled by Solador over Tailscale"
license = "MIT"

[[bin]]
name = "solador-agent"
path = "src/main.rs"

[build-dependencies]
# The git-derived CalVer, shared with `app/src-tauri/build.rs`. Dependency-free
# and std-only, so it costs a Linux musl cross-build nothing.
solador-buildversion = { path = "../crates/buildversion" }

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
# The wire contract itself. One definition, shared with the app.
solador-wire = { path = "../crates/wire" }
serde_json = "1"
# Same explicit feature set as crates/localhost, not sysinfo's defaults.
# Both are workspace members now, and cargo unifies features across a workspace
# build -- so leaving this on defaults would silently hand `components` and
# `users` back to crates/localhost, whose manifest turns them off on purpose.
# One sysinfo configuration for the whole repo, which is what that comment
# always intended. The agent uses System/Disks/Networks and nothing else.
sysinfo = { version = "0.39", default-features = false, features = [
  "system",
  "disk",
  "network",
] }
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- `solador-agent update` / `rollback` (#393) ---------------------------
# The updater verifies the feed and the downloaded binary IN THIS BINARY, under
# the public key(s) `build.rs` compiles in from `agent/release-signing-key*.pub`.
# It does NOT depend on `crates/updatefeed` — that crate is the feed PRODUCER,
# release tooling, and `scripts/agent-deps-guard.sh` fails CI on that edge — so
# the verifier is `minisign-verify` used directly, at the same `^0.2` the
# producer and `tauri-plugin-updater` resolve, so one implementation exists in
# the workspace and the consumer cannot disagree with the producer about what
# verifies.
minisign-verify = "0.2"
# SHA-256 over the installed executable, compared against the feed's per-target
# hash to decide whether a release changed the agent at all. Same pin as
# crates/openclaw and crates/updatefeed, so one sha2 resolves.
sha2 = "0.11"
hex = "0.4"
# Only to read the key id out of a compiled-in public key's base64 line, the
# way `minisign -V` prints it, so a refusal can name which key it did not
# match. 0.23 is what crates/openclaw and crates/updatefeed resolve; reqwest's
# own tree brings 0.22 beside it regardless, so this adds no third copy.
base64 = "0.23"
# HTTPS to github.com for the feed and the binary, plain HTTP to the agent's
# own bind address for the post-restart health probe. `rustls-tls` bundles the
# webpki roots, so a statically linked musl build on a distro with no CA store
# still verifies GitHub's certificate; same reqwest/TLS stack the workspace's
# other crates resolve, no `json` feature (serde_json decodes the two bodies).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(unix)'.dependencies]
# `getuid` for the launchd `gui/<uid>` domain and `access(W_OK)` for the
# install-directory writability refusal. Already a transitive dependency of
# tokio; this is a new edge, not a new package.
libc = "0.2"

[dev-dependencies]
# `ServiceExt::oneshot` drives the router in auth middleware tests.
tower = { version = "0.5", features = ["util"] }
# Deterministic minisign signing for the updater's tests (#393): keypairs from
# fixed seeds, signatures assembled in the documented minisign format (Ed25519
# over BLAKE2b-512 of the payload, then a global signature over sig+trusted
# comment). Test-only — the shipped binary VERIFIES and never signs. dalek v3
# is what crates/openclaw already resolves; blake2 is the one new package, and
# it is the prehash minisign specifies. 0.10, not 0.11, on a count: 0.10 sits
# on the `digest 0.10` the lock already carries (via sha2 0.10, tauri's) and
# adds exactly one package; 0.11 adds `cmov` and `ctutils` beside it (measured
# with `cargo update -p blake2`).
ed25519-dalek = "3"
blake2 = "0.10"
# Loopback "release server" and temp install trees for the transaction tests.
tempfile = "3"

