[package]
name = "solador-agent"
# NOT the version this agent ships under, and not the version it reports.
#
# Since #390 the agent is a PUBLISHED artifact, and since #472/#490 it carries a
# version of its own (`agent-vYYYY.M.N`; a source build's is
# `<base>+dev.<k>.g<sha>`) — derived by `scripts/get-version-info.sh
# --agent-version`, compiled in by `build.rs`, printed by `--version` and served
# at `/v1/health`. `docs/VERSIONING.md` reclassifies the agent accordingly; this
# number stopped being a release version there.
#
# It survives as the **wire-contract marker** the log below has always been: a
# minor here records a key this agent has never produced before, which is what
# `crates/wire`'s tolerance notes cite. Nothing reads it at runtime any more —
# `crate_version()` left `agent/deploy/lib.sh` with it — so keep bumping it for
# the contract, never for a release.
# 0.5.2: `cpu.thermalState` is measured on macOS through the shared thermal
# reader. The existing 0–3 wire encoding is unchanged; unsupported platforms
# still omit the key instead of inventing a nominal state.
# 0.5.1: `gpu` is measured on macOS too, out of IOKit's `IOAccelerator`
# registry through `crates/accelerator` — the reader the cockpit's own card
# uses. A patch, not a minor: no key this agent has not produced before, only
# a platform it now fills them on. Still omitted wherever nothing answered.
# 0.5.0: `processes[].cpuCores` (#378). A minor for the same reason 0.4.0 was:
# a wire field this agent has never produced before. It also FIXES what
# `cpuPercent` carries on Linux — the process refresh has its own sysinfo
# `System` now, so a 60-second numerator is no longer divided by a 1-second
# denominator (60x, measured at 210.8% for a process using 3.55% of one core).
# The new key is the version signal a consumer reads: absent means an agent
# whose `cpuPercent` is still inflated, and the row renders `—`.
# 0.4.0: `gpu` is measured on hosts with an NVIDIA card, via `nvidia-smi`
# (#217). A minor, not a patch: this agent produces a wire field it has never
# produced before. Still omitted everywhere nothing is measured.
# 0.3.1: `processes[]` lists processes only — Linux threads and kernel threads
# are no longer reported as processes of their own (#211).
# 0.3.0: `/v1/snapshot` stops emitting figures it never measured (#183) — the
# keys are omitted instead. `/v1/health`'s `version` is how you tell a
# redeployed agent from one still sending the old zeros (or, now, the old
# fabricated thread rows).
version = "0.5.2"
edition = "2021"
description = "Per-host metrics agent polled by Solador"
license = "MIT"

[[bin]]
name = "solador-agent"
path = "src/main.rs"

[build-dependencies]
# The git-derived CalVer, shared with `app/src-tauri/build.rs`. Dependency-free
# and std-only, so it costs a Linux musl cross-build nothing.
solador-buildversion = { path = "../crates/buildversion" }

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
# The wire contract itself. One definition, shared with the app.
solador-wire = { path = "../crates/wire" }
# The same OS thermal-pressure reader as the local cockpit; unsupported
# platforms return None without depending on any platform framework.
solador-thermal = { path = "../crates/thermal" }
# How a certificate fingerprint is WRITTEN (#448), shared with the cockpit's
# pinning client so `tls-fingerprint` and Settings' Trust dialog cannot drift.
# Dependency-free, so this edge costs the musl cross-build nothing.
solador-certpin = { path = "../crates/certpin" }
serde_json = "1"
# Same explicit feature set as crates/localhost, not sysinfo's defaults.
# Both are workspace members now, and cargo unifies features across a workspace
# build -- so leaving this on defaults would silently hand `components` and
# `users` back to crates/localhost, whose manifest turns them off on purpose.
# One sysinfo configuration for the whole repo, which is what that comment
# always intended. The agent uses System/Disks/Networks and nothing else.
sysinfo = { version = "0.39", default-features = false, features = [
  "system",
  "disk",
  "network",
] }
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- `solador-agent update` / `rollback` (#393) ---------------------------
# The updater verifies the feed and the downloaded binary IN THIS BINARY, under
# the public key(s) `build.rs` compiles in from `agent/release-signing-key*.pub`.
# It does NOT depend on `crates/updatefeed` — that crate is the feed PRODUCER,
# release tooling, and `scripts/agent-deps-guard.sh` fails CI on that edge — so
# the verifier is `minisign-verify` used directly, at the same `^0.2` the
# producer and `tauri-plugin-updater` resolve, so one implementation exists in
# the workspace and the consumer cannot disagree with the producer about what
# verifies.
minisign-verify = "0.3"
# SHA-256 over the installed executable, compared against the feed's per-target
# hash to decide whether a release changed the agent at all. Same pin as
# crates/openclaw and crates/updatefeed, so one sha2 resolves.
sha2 = "0.11"
hex = "0.4"
# Only to read the key id out of a compiled-in public key's base64 line, the
# way `minisign -V` prints it, so a refusal can name which key it did not
# match. 0.23 is what crates/openclaw and crates/updatefeed resolve; reqwest's
# own tree brings 0.22 beside it regardless, so this adds no third copy.
base64 = "0.23"
# HTTPS to github.com for the feed and the binary, plain HTTP to the agent's
# own bind address for the post-restart health probe. `rustls-tls` bundles the
# webpki roots, so a statically linked musl build on a distro with no CA store
# still verifies GitHub's certificate; same reqwest/TLS stack the workspace's
# other crates resolve, no `json` feature (serde_json decodes the two bodies).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# --- SOLADOR_AGENT_TLS=1 (#447): self-signed HTTPS, generated once, kept ---
# --- for the host's lifetime -----------------------------------------------
# The self-signed ECDSA P-256 keypair (agent/src/tls.rs). "ring", not
# "aws_lc_rs": `reqwest`'s `rustls-tls` above already resolves `ring` as the
# workspace's one crypto backend, and rcgen's alternative pulls in
# `aws-lc-sys`, a C/cmake build the musl cross-compile (`cargo-zigbuild`, no
# Docker on the runner) does not need and should not gain.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
# Only for `rustls::crypto::ring::default_provider().install_default()`
# (main.rs's TLS startup path): rustls needs a process-wide default crypto
# provider installed once, and axum-server's "tls-rustls-no-provider" feature
# (below) deliberately picks none, so this is the one place that chooses —
# the same "ring" reqwest already resolves, never a second backend. The
# floor is 0.23.45, not "0.23" (a bare "0.23" would let cargo resolve down
# to 0.23.0) — a MINIMUM, via cargo's ordinary caret requirement (a later
# 0.23.x is still allowed and wanted), not an exact pin: RUSTSEC-2026-0285.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
# The TLS server itself: `axum_server::bind_rustls` around the same `Router`
# the plain-HTTP path serves. The floor is 0.7.3, not "0.7" (a bare "0.7"
# would let cargo resolve down to 0.7.0) — a MINIMUM, via cargo's ordinary
# caret requirement (a later 0.7.x is still allowed and wanted), not an
# exact pin — and on the "tls-rustls-no-provider" feature specifically —
# NOT the crate's own default "tls-rustls", which pulls `rustls/aws-lc-rs`
# unconditionally (the same C/cmake backend `rcgen` above is kept off);
# "tls-rustls-no-provider" was added between 0.7.0 and 0.7.3, so the floor
# is load-bearing, not habit.
axum-server = { version = "0.7.3", default-features = false, features = ["tls-rustls-no-provider"] }

[target.'cfg(unix)'.dependencies]
# `getuid` for the launchd `gui/<uid>` domain, `getpwuid_r` for the invoking
# user's name, `kill(SIGTERM)` plus libproc's `proc_pidinfo`/`proc_pidpath` for
# the system-daemon restart (#507), and `access(W_OK)` for the
# install-directory writability refusal. Already a transitive dependency of
# tokio; this is a new edge, not a new package.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The GPU on a Mac: the IOKit `IOAccelerator` reader, shared with the cockpit's
# `crates/localhost` so a Mac host's remote card and the local one use one
# mapping. Deliberately this narrow crate and not `crates/localhost` itself,
# which would pull the battery and local sampler into the daemon. It
# references no symbol newer than macOS 11.0, the agent's floor — see its
# `DEFAULT_MAIN_PORT`.
solador-accelerator = { path = "../crates/accelerator" }

[dev-dependencies]
# `ServiceExt::oneshot` drives the router in auth middleware tests.
tower = { version = "0.5", features = ["util"] }
# Deterministic minisign signing for the updater's tests (#393): keypairs from
# fixed seeds, signatures assembled in the documented minisign format (Ed25519
# over BLAKE2b-512 of the payload, then a global signature over sig+trusted
# comment). Test-only — the shipped binary VERIFIES and never signs. dalek v3
# is what crates/openclaw already resolves; blake2 provides the prehash
# minisign specifies.
ed25519-dalek = "3"
blake2 = "0.11"
# Loopback "release server" and temp install trees for the transaction tests.
tempfile = "3"
# Test-only: `CertificateDer`/`PrivateKeyDer`/`ServerName` for the TLS tests
# (agent/src/tls.rs, agent/src/update.rs, agent/tests/update_flow.rs) that
# drive a real rustls handshake or client verifier directly. The shipped
# binary never names these types itself — `rcgen`/`axum-server`/`reqwest`
# take and return plain `Vec<u8>` DER at every boundary this crate's own code
# crosses — and the crate costs nothing new to compile: `axum-server`'s
# "tls-rustls-no-provider" feature already resolves it transitively.
rustls-pki-types = "1"
