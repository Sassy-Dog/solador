# Deliberately its own workspace root, not a member of the repo-root workspace:
# the agent keeps its own Cargo.lock, toolchain pin, release profile and CI job
# (agent-tests, on the Linux fleet it actually deploys to). An EMPTY [workspace]
# table is what stops cargo walking up — parent-side `exclude` breaks down inside
# a worktree nested under the repo, where cargo then finds the outer workspace.
[workspace]

[package]
name = "devcanopy-agent"
version = "0.2.0"
edition = "2021"
description = "Per-host metrics agent polled by DevCanopy over Tailscale"
license = "MIT"

[[bin]]
name = "devcanopy-agent"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
# The wire contract itself. One definition, shared with the app.
devcanopy-wire = { path = "../crates/wire" }
serde_json = "1"
sysinfo = "0.39"
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# `ServiceExt::oneshot` drives the router in auth middleware tests.
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
