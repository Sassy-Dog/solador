[package]
name = "devcanopy-agent"
version = "0.2.0"
edition = "2021"
description = "Per-host metrics agent polled by DevCanopy over Tailscale"
license = "MIT"

[[bin]]
name = "devcanopy-agent"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
