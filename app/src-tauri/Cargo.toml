[package]
name = "devcanopy-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = "2"

[dependencies]
devcanopy-wire = { path = "../../crates/wire" }
viewmodel = { path = "../../crates/viewmodel" }
agentclient = { path = "../../crates/agentclient" }
# Settings/hosts/credentials. The keyring dependency moved here with it: this
# crate reaches the OS credential store through `store::KeyringStore`, so
# there is one spelling of the service/account naming, not two.
devcanopy-store = { path = "../../crates/store" }
# The Repos / GitHub Runners panels' data layer: the REST client plus the pure
# workflow-health, runner and roster mappings. This crate is the view side.
devcanopy-github = { path = "../../crates/github" }
# Third-party availability: the shared status vocabulary and the three
# transports the five watched vendors publish through.
devcanopy-servicestatus = { path = "../../crates/servicestatus" }
# `join_all` for the five status pages, which are five independent hosts and
# have no reason to be read in sequence. Already in the lock via crates/github.
futures-util = "0.3"
# This machine's own metrics, for the local host card that leads the grid. The
# Swift app collects them through HostMetricsKit; this is the portable twin.
devcanopy-localhost = { path = "../../crates/localhost" }
# The Usage panel's three sources: Claude Code's local logs, Neon consumption,
# Sentry event stats. This crate renders them.
devcanopy-usage = { path = "../../crates/usage" }
# The Azure Cost panel's reader — the SAS blob transport, the CSV fold, and the
# fingerprint cache that keeps an unchanged export free.
devcanopy-azurecost = { path = "../../crates/azurecost" }
# The OpenClaw panel's gateway client: WS protocol v3, the Ed25519 device
# identity, and the frame→snapshot reducer. Default features (`ws`) on, because
# this crate is the one consumer that actually opens the socket.
devcanopy-openclaw = { path = "../../crates/openclaw" }
# The GitHub clocks are `DateTime<Utc>` (run start times, roster sightings), so
# the panel layer speaks the same type rather than converting at every call.
# Same pin as crates/github's, so one chrono resolves for the workspace.
#
# `clock` is on **here and nowhere else**: the Claude usage rollup's "today" is
# a *local* calendar day (`usage::claude::local_day_start` takes the offset as an
# argument precisely so the crates stay wall-clock-free), and this shell is the
# layer that is allowed to read the machine. Every other clock in this crate
# still comes from `panel::now_unix`, which is UTC.
chrono = { version = "0.4", default-features = false, features = [
  "std",
  "serde",
  "clock",
] }
# Locating `~/Repos` for the local branch/worktree scan. Already the store's
# dependency for the platform config dir — a new edge, not a new package.
dirs = { workspace = true }
# Host ids arrive from the webview as strings; this parses them back into the
# type `store::Host` keys on. Same major as the store's own, so one uuid
# resolves for the workspace.
uuid = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tauri = "2"
serde_json = { workspace = true }
tauri-plugin-opener = "2.5.4"
tauri-plugin-notification = "2.3.3"

[dev-dependencies]
# Seed/store tests write a real store file in a throwaway directory rather
# than mocking the filesystem — same as crates/store's own tests.
tempfile = "3"
# The ACL scope test rebuilds the granted `opener:allow-open-url` glob with the
# **same** matcher `tauri-plugin-opener` enforces it with, so the assertion is
# about the real rule rather than a second reading of it. Same pin as the
# plugin's, so one glob resolves for the workspace; test-only, so it adds
# nothing to the shipped binary.
glob = "0.3"
