[package]
name = "devcanopy-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = "2"

[dependencies]
devcanopy-wire = { path = "../../crates/wire" }
viewmodel = { path = "../../crates/viewmodel" }
agentclient = { path = "../../crates/agentclient" }
# Settings/hosts/credentials. The keyring dependency moved here with it: this
# crate reaches the OS credential store through `store::KeyringStore`, so
# there is one spelling of the service/account naming, not two.
devcanopy-store = { path = "../../crates/store" }
# The Repos / GitHub Runners panels' data layer: the REST client plus the pure
# workflow-health, runner and roster mappings. This crate is the view side.
devcanopy-github = { path = "../../crates/github" }
# The GitHub clocks are `DateTime<Utc>` (run start times, roster sightings), so
# the panel layer speaks the same type rather than converting at every call.
# Same feature set as crates/github's, so one chrono resolves for the workspace.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
# Locating `~/Repos` for the local branch/worktree scan. Already the store's
# dependency for the platform config dir — a new edge, not a new package.
dirs = { workspace = true }
# Host ids arrive from the webview as strings; this parses them back into the
# type `store::Host` keys on. Same major as the store's own, so one uuid
# resolves for the workspace.
uuid = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tauri = "2"
serde_json = { workspace = true }

[dev-dependencies]
# Seed/store tests write a real store file in a throwaway directory rather
# than mocking the filesystem — same as crates/store's own tests.
tempfile = "3"
