<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DevCanopy</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- The Hosts panel. Its title comes from Rust's panel table, like every
       other string on the page; the grid's column count comes from the same
       payload's `hostColumns`. -->
  <div id="cockpitView">
    <div class="topbar">
      <h1 class="panel-title" id="hostsTitle"></h1>
      <!-- The host tab bar, for the "Show as tabs" overflow mode. It rides the
           title line rather than sitting on its own row below it: the overflow
           mode exists because the window is too narrow to place cards side by
           side, and spending a whole row on the switcher is the last thing a
           short window can afford.

           Hidden unless the cockpit payload carries a `hostTabs` block:
           WHETHER the cards collapse is `viewmodel::cockpit::host_tabs`'s
           decision (below the side-by-side breakpoint, more than one host, and
           the user having asked for it), and re-deriving any of that here would
           be a second implementation of it. Its buttons are built by app.js
           from that block -- there is no static label here, for the same reason
           the Settings tabs have none. -->
      <nav class="tabs host-tabs" id="hostTabs" hidden></nav>
      <span class="grow"></span>
      <!-- Hidden until the cockpit payload supplies its label: a button that
           renders before Rust has named it would be a string this file
           invented. -->
      <button class="btn" id="settingsToggle" type="button" hidden></button>
    </div>
    <p class="empty" id="emptyMsg"></p>
    <div class="cockpit" id="cockpit"></div>

    <!-- The panel block below the host grid. Which panels share a row, and in
         what order, is `viewmodel::cockpit`'s `hosts_forward` layout reflowed
         for the measured width and delivered as the cockpit payload's
         `panelRows`; app.js only applies it. The sections start here as
         authored siblings so they exist before the first payload arrives, and
         app.js re-parents them into row containers on the first reflow. -->
    <div class="panel-rows" id="panelRows">

    <!-- Containers / VMs. Hidden until Rust has supplied a payload: a panel
         that renders its own chrome before anything has answered would be a
         heading this file invented. Its rows are built by containers.js from
         the `containers` command; there is no static copy of any label,
         status word or colour here, for the same reason the cockpit has none. -->
    <section class="panel" id="containersPanel" hidden>
      <header class="panel-hdr">
        <h2 class="panel-title" id="containersTitle"></h2>
        <span class="grow"></span>
        <span class="panel-trailing" id="containersTrailing"></span>
      </header>
      <div class="panel-body" id="containersBody"></div>
      <p class="panel-footer" id="containersFooter" hidden></p>
    </section>

    <!-- Repos. One fixed row per tracked repo, so the card never resizes as CI
         activity comes and goes. Hidden until Rust has supplied a payload, for
         the same reason the Containers panel is: chrome that renders before
         anything has answered would be a heading this file invented. Its
         column labels and widths are Rust's too -- there is no static copy of
         REPO/ISSUES/PRS/... here. -->
    <section class="panel" id="reposPanel" hidden>
      <header class="panel-hdr">
        <h2 class="panel-title" id="reposTitle"></h2>
        <span class="grow"></span>
        <span class="panel-trailing" id="reposTrailing"></span>
      </header>
      <div class="panel-body" id="reposBody"></div>
      <p class="panel-health" id="reposHealth" hidden></p>
    </section>

    <!-- GitHub Runners. Registered runners plus the remembered ones that have
         de-registered, which is why a row can be present without a runner
         behind it. Same rules as above: every stat, chip, state word and
         colour is built by github.js from the `runners` command. -->
    <section class="panel" id="runnersPanel" hidden>
      <header class="panel-hdr">
        <h2 class="panel-title" id="runnersTitle"></h2>
        <span class="grow"></span>
        <span class="panel-trailing" id="runnersTrailing"></span>
      </header>
      <div class="panel-body" id="runnersBody"></div>
      <p class="panel-footer" id="runnersFooter" hidden></p>
    </section>

    <!-- Usage. Claude Code token rollups, plus a Neon and a Sentry section
         when those providers are configured — an unconfigured one contributes
         no markup at all, which is why nothing below is a static heading.
         Every window label, figure, em dash and bar colour is built by usage.js
         from the `usage` command. -->
    <section class="panel" id="usagePanel" hidden>
      <header class="panel-hdr">
        <h2 class="panel-title" id="usageTitle"></h2>
        <span class="grow"></span>
        <span class="panel-trailing" id="usageTrailing"></span>
      </header>
      <div class="panel-body" id="usageBody"></div>
      <p class="panel-footer" id="usageFooter" hidden></p>
    </section>

    <!-- Azure Cost. Month-to-date spend, a prior-month reference, a projection
         against an optional budget, and the top resource groups and types.
         Same rules as above: the headline, the caption, every dollar figure and
         the bar's colour are azure.js applying what the `azure_cost` command
         decided. -->
    <section class="panel" id="azurePanel" hidden>
      <header class="panel-hdr">
        <h2 class="panel-title" id="azureTitle"></h2>
        <span class="grow"></span>
        <span class="panel-trailing" id="azureTrailing"></span>
      </header>
      <div class="panel-body" id="azureBody"></div>
      <p class="panel-footer" id="azureFooter" hidden></p>
    </section>

    <!-- OpenClaw. An agent farm's per-agent status, cron health, channel
         connectivity and token usage, fed by a live WebSocket rather than a
         poll — which is why it has no footer element: the connection line
         inside the body is what says whether the socket is up. Every string,
         count and colour is built by openclaw.js from the `openclaw` command. -->
    <section class="panel" id="openclawPanel" hidden>
      <header class="panel-hdr">
        <h2 class="panel-title" id="openclawTitle"></h2>
        <span class="grow"></span>
        <span class="panel-trailing" id="openclawTrailing"></span>
      </header>
      <div class="panel-body" id="openclawBody"></div>
    </section>

    </div>
  </div>

  <!-- Settings. An in-app view, not a second window: a window would need
       `core:webview:allow-create-webview-window` granted to the webview,
       widening the one seam with no automated coverage (#123), and this needs
       no ACL surface at all. Every control below is built by settings.js from
       the `settings_view` payload -- there is no static copy of any label
       here, for the same reason the cockpit has none. -->
  <section class="settings" id="settings" hidden>
    <div class="topbar">
      <h1 class="panel-title" id="settingsTitle"></h1>
      <span class="grow"></span>
      <span class="status" id="settingsStatus" role="status"></span>
      <button class="btn" id="settingsClose" type="button"></button>
    </div>
    <nav class="tabs" id="settingsTabs"></nav>
    <div class="settings-body" id="settingsBody"></div>
  </section>

  <!-- One card per host, cloned from here. Hooks are classes, not ids: with N
       hosts on the page an id would be duplicated N times, which makes
       `getElementById` return whichever card happened to render first. -->
  <template id="cardTpl">
    <div class="card">
      <!-- One header row, not two: the host's identity and its CPU reading used
           to stack, and the second line bought nothing a single line could not
           say. The glyph stays as the CPU section's marker, matching Memory /
           Graphics / Disk / Network / Volumes below. `.cpuModel` is the only
           member allowed to give ground (see `.title` in app.css) -- an
           `Intel(R) Core(TM) i9-10980XE CPU @ 3.00GHz` must ellipsize rather
           than shove the percentage off the card. -->
      <header class="hdr"><span class="dot connDot"></span><span class="host hostName"></span>
        <i class="glyph"></i><span class="title cpuModel"></span>
        <span class="badge thermal"></span><span class="grow"></span>
        <span class="stale staleMsg"></span><span class="big cpuValue"></span></header>
      <div class="chart">
        <div class="axis"><span>100%</span><span>50%</span><span>0%</span></div>
        <div class="plot cpuChart" data-h="110"></div>
      </div>
      <div class="cores-wrap"><div class="cores"></div></div>
      <hr />
      <div class="cols2">
        <section>
          <div class="sec-hdr"><i class="glyph"></i><span class="title">Memory</span>
            <span class="grow"></span><span class="big memValue"></span></div>
          <div class="chart"><div class="axis"><span>100%</span><span>50%</span><span>0%</span></div>
            <div class="plot memChart" data-h="90"></div></div>
          <div class="foot"><span class="swapText"></span><span class="grow"></span><span class="pressureText"></span></div>
        </section>
        <section>
          <div class="sec-hdr"><i class="glyph"></i><span class="title">Graphics</span>
            <span class="grow"></span><span class="big gpuValue"></span></div>
          <div class="chart"><div class="axis"><span>100%</span><span>50%</span><span>0%</span></div>
            <div class="plot gpuChart" data-h="90"></div></div>
          <div class="foot"><span class="vramText"></span></div>
        </section>
      </div>
      <hr />
      <div class="cols2">
        <section>
          <div class="sec-hdr"><i class="glyph"></i><span class="title">Disk I/O</span><span class="grow"></span>
            <div class="legends">
              <span class="lg"><i class="sw-read"></i>Read:<b class="diskRead"></b></span>
              <span class="lg"><i class="sw-write"></i>Write:<b class="diskWrite"></b></span>
            </div></div>
          <div class="chart"><div class="axis two"><span class="diskAxis"></span><span>0</span></div>
            <div class="plot diskChart" data-h="90"></div></div>
        </section>
        <section>
          <div class="sec-hdr"><i class="glyph"></i><span class="title">Network I/O</span><span class="grow"></span>
            <div class="legends">
              <span class="lg"><i class="sw-net"></i>Down:<b class="netDown"></b></span>
              <span class="lg"><i class="sw-netup"></i>Up:<b class="netUp"></b></span>
            </div></div>
          <div class="chart"><div class="axis two"><span class="netAxis"></span><span>0</span></div>
            <div class="plot netChart" data-h="90"></div></div>
        </section>
      </div>
      <hr />
      <div class="sec-hdr"><i class="glyph"></i><span class="title">Volumes</span>
        <span class="grow"></span><span class="big muted volumeCount"></span></div>
      <div class="vols volumes"></div>
      <hr />
      <div class="cols2">
        <section><div class="lbl">TOP CPU</div><div class="procs topCpu"></div></section>
        <section><div class="lbl">TOP RAM</div><div class="procs topRam"></div></section>
      </div>
    </div>
  </template>
  <!-- Order matters: settings.js reads `esc`, `callRust` and `refreshCockpit`
       from app.js's top-level lexical scope (shared across classic scripts),
       and wires its own listeners once app.js has defined them. -->
  <script src="app.js"></script>
  <script src="settings.js"></script>
  <script src="containers.js"></script>
  <script src="github.js"></script>
  <script src="usage.js"></script>
  <script src="azure.js"></script>
  <script src="openclaw.js"></script>
</body>
</html>
